<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidus · Vídeos</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root { --bg:#00170a; --gold:#c9962a; --txt:#f6f0e1; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:Montserrat, Arial, sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px; min-height:100vh; }
  canvas { height:min(78vh, 1920px); max-width:100%; aspect-ratio:9/16; border-radius:14px; box-shadow:0 10px 40px #0008; background:#000; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; width:min(560px,100%); }
  button, a.btn { background:var(--gold); color:#01210f; border:0; border-radius:999px; padding:10px 18px;
                  font-weight:800; cursor:pointer; text-decoration:none; font-size:14px; }
  a.btn.alt { background:transparent; color:var(--gold); border:1px solid var(--gold); }
  input[type=range] { flex:1; accent-color:var(--gold); }
  #time { font-variant-numeric:tabular-nums; min-width:96px; text-align:right; }
  body.export .bar { display:none; }
  body.export { padding:0; }
  body.export canvas { height:auto; width:1080px; border-radius:0; }
</style>
</head>
<body>
<div class="bar">
  <a class="btn alt" href="?v=1">1 · Apresentação</a>
  <a class="btn alt" href="?v=2">2 · Proposta</a>
</div>
<canvas id="cv" width="1080" height="1920"></canvas>
<div class="bar">
  <button id="play">▶ Play</button>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <span id="time">0.0s</span>
</div>

<script src="engine.js"></script>
<script src="video1-apresentacao.js"></script>
<script src="video2-proposta.js"></script>
<script>
  const qs = new URLSearchParams(location.search);
  const TL = qs.get('v') === '2' ? VIDEO2 : VIDEO1;
  if (qs.has('export')) document.body.classList.add('export');
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

  window.DURATION = TL.duration;
  window.renderAt = t => renderFrame(ctx, TL, Math.min(t, TL.duration - 1e-3));
  window.ready = Promise.all([
    loadImg('foto', 'assets/foto-renan.jpg'),
    loadImg('icone', 'assets/logo-icone.png'),
    loadImg('nome', 'assets/logo-nome.png'),
    loadImg('gestao', 'assets/logo-gestao.png'),
    document.fonts.load("800 40px 'Montserrat'"),
    document.fonts.load("600 40px 'Cormorant Garamond'"),
    document.fonts.load("italic 600 40px 'Cormorant Garamond'")
  ]).then(() => document.fonts.ready);

  // player de pré-visualização
  let playing = false, t0 = 0, cur = 0;
  const seek = document.getElementById('seek'), time = document.getElementById('time'), btn = document.getElementById('play');
  function show(t) { cur = t; window.renderAt(t); seek.value = t / TL.duration * 1000; time.textContent = t.toFixed(1) + 's / ' + TL.duration.toFixed(0) + 's'; }
  function loop(now) {
    if (!playing) return;
    const t = (now - t0) / 1000;
    if (t >= TL.duration) { playing = false; btn.textContent = '▶ Play'; show(TL.duration); return; }
    show(t); requestAnimationFrame(loop);
  }
  btn.onclick = () => {
    playing = !playing; btn.textContent = playing ? '❚❚ Pausa' : '▶ Play';
    if (playing) { if (cur >= TL.duration - .05) cur = 0; t0 = performance.now() - cur * 1000; requestAnimationFrame(loop); }
  };
  seek.oninput = () => { playing = false; btn.textContent = '▶ Play'; show(seek.value / 1000 * TL.duration); };
  window.ready.then(() => show(0));
</script>
</body>
</html>
