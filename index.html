h3{font-size:10pt;margin:0 0 6px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:9.5pt}th{text-align:left;font-size:8.5pt;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line);padding:5px 6px}
td{padding:4.5px 6px;border-bottom:1px solid #f1f5f9}tr{break-inside:avoid}.r{text-align:right;white-space:nowrap}.av{color:var(--muted);font-size:8.5pt}
tr.sub td{font-weight:700;background:#f7fafb}.neg{color:var(--red)}.pos{color:var(--green)}
.kps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kp{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kl{font-size:8.5pt;color:var(--muted)}.kv{font-size:14pt;font-weight:700;margin-top:2px}.kvar{font-size:8.5pt;margin-top:2px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.destaque{margin-top:8px;padding:8px 10px;background:#f7fafb;border-left:3px solid var(--teal);font-size:9.5pt}
.nota{font-size:8.5pt;color:var(--muted);margin-top:6px}.obs{font-size:10pt;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:8px;white-space:normal}
footer{margin-top:18px;padding-top:6px;border-top:1px solid var(--line);font-size:8pt;color:var(--muted);text-align:center}
.sc-svg{display:block;max-width:100%;height:auto}.sc-grid{stroke:#e2e8f0}.sc-zero{stroke:#94a3b8}.sc-ax{font-size:10px;fill:#64748b}
.sc-leg{display:flex;gap:12px;font-size:8.5pt;color:var(--muted);margin:0 0 4px}.sc-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}.sc-line{height:3px}
`;

/* ===================== RENTABILIDADE DO BPO ===================== */
const ATIV_LBL={lancamentos:'Lançamentos',conciliacao:'Conciliação',cobranca:'Cobrança',pagamentos:'Pagamentos',fechamento:'Fechamento',relatorio:'Relatório',atendimento:'Atendimento ao cliente',outros:'Outros'};
const fmtMin=m=>{ m=Math.round(Number(m||0)); return `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`; };
let rbAno=new Date().getFullYear(), rbMes=new Date().getMonth()+1, rbGestor=false;
// ---- cronômetro (sobrevive a recarregar a página e funciona em qualquer tela) ----
function timerGet(){ try{ return JSON.parse(localStorage.getItem('candidus_timer')||'null'); }catch(e){ return null; } }
function timerSet(t){ try{ t?localStorage.setItem('candidus_timer',JSON.stringify(t)):localStorage.removeItem('candidus_timer'); }catch(e){} timerChip(); }
let timerInt=null;
function timerChip(){
  let el=document.getElementById('timerChip'); const t=timerGet();
  if(!t){ if(el) el.remove(); if(timerInt){ clearInterval(timerInt); timerInt=null; } return; }
  if(!el){ el=document.createElement('div'); el.id='timerChip'; el.className='timer-chip'; document.body.appendChild(el); }
  const upd=()=>{ const min=Math.max(0,Math.floor((Date.now()-t.inicio)/60000));
    el.innerHTML=`<span class="tc-dot"></span>⏱ <b>${esc(coName(t.co))}</b> · ${ATIV_LBL[t.atividade]||''} · ${fmtMin(min)} <button id="tcStop">Parar</button>`;
    const b=document.getElementById('tcStop'); if(b) b.onclick=()=>pararTimer(); };
  upd(); if(!timerInt) timerInt=setInterval(upd,30000);
}
function iniciarTimer(){
  if(timerGet()){ toast('Já tem um cronômetro rodando.','err'); return; }
  const co0=companyId||(companies[0]&&companies[0].id)||'';
  $('modalRoot').innerHTML=`<div class="overlay"><div class="modal sm"><div class="modal-h"><h2>Iniciar cronômetro</h2><button class="x" id="mx">×</button></div>
    <div class="modal-b"><div class="field"><label>Cliente</label><select id="tmCo">${companies.map(c=>`<option value="${c.id}" ${c.id===co0?'selected':''}>${esc(c.nome_fantasia||c.razao_social)}</option>`).join('')}</select></div>
      <div class="field"><label>Atividade</label><select id="tmAt">${Object.entries(ATIV_LBL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
      <div class="hint">Pode navegar pelo sistema à vontade: o cronômetro fica no canto da tela até você parar.</div></div>
    <div class="modal-f"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn" id="mSave">▶ Iniciar</button></div></div></div>`;
  $('mx').onclick=$('mCancel').onclick=closeModal;
  $('mSave').onclick=()=>{ timerSet({co:$('tmCo').value, atividade:$('tmAt').value, inicio:Date.now()}); closeModal(); toast('Cronômetro iniciado.'); if(currentView==='rentabilidade') renderRentabilidade(); };
}
function pararTimer(){ const t=timerGet(); if(!t) return; openApontamento({co:t.co, atividade:t.atividade, minutos:Math.max(1,Math.round((Date.now()-t.inicio)/60000)), doTimer:true}); }
// ---- apontamento manual / do cronômetro / ao concluir tarefa ----
function openApontamento(p={}){
  const co0=p.co||companyId||(companies[0]&&companies[0].id)||'';
  const min=p.minutos||0;
  $('modalRoot').innerHTML=`<div class="overlay"><div class="modal sm"><div class="modal-h"><h2>${p.titulo||'Apontar horas'}</h2><button class="x" id="mx">×</button></div>
    <div class="modal-b">${p.dica?`<div class="box">${p.dica}</div>`:''}
      <div class="field"><label>Cliente</label><select id="apCo">${companies.map(c=>`<option value="${c.id}" ${c.id===co0?'selected':''}>${esc(c.nome_fantasia||c.razao_social)}</option>`).join('')}</select></div>
      <div class="row2"><div class="field"><label>Data</label><input id="apData" type="date" value="${p.data||todayStr()}"></div>
        <div class="field"><label>Atividade</label><select id="apAt">${Object.entries(ATIV_LBL).map(([k,v])=>`<option value="${k}" ${k===(p.atividade||'outros')?'selected':''}>${v}</option>`).join('')}</select></div></div>
      <div class="row2"><div class="field"><label>Horas</label><input id="apH" type="number" min="0" max="24" step="1" value="${Math.floor(min/60)}"></div>
        <div class="field"><label>Minutos</label><input id="apM" type="number" min="0" max="59" step="1" value="${min%60}"></div></div>
      <div class="field"><label>Descrição (opcional)</label><input id="apDesc" value="${esc(p.descricao||'')}" placeholder="Ex.: conciliação de outubro"></div></div>
    <div class="modal-f">${p.doTimer?'<button class="btn ghost" id="apDescartar" style="margin-right:auto;color:var(--red)">Descartar cronômetro</button>':''}
      <button class="btn ghost" id="mCancel">${p.task_id?'Pular':'Cancelar'}</button><button class="btn" id="mSave">Salvar</button></div></div></div>`;
  $('mx').onclick=$('mCancel').onclick=closeModal;
  if(p.doTimer) $('apDescartar').onclick=()=>{ timerSet(null); closeModal(); toast('Cronômetro descartado.'); };
  $('mSave').onclick=async ()=>{
    const minutos=(parseInt($('apH').value,10)||0)*60+(parseInt($('apM').value,10)||0);
    if(minutos<=0){ toast('Informe o tempo.','err'); return; }
    if(minutos>24*60){ toast('Máximo de 24h por apontamento.','err'); return; }
    $('mSave').disabled=true;
    const { error }=await db.from('bpo_apontamentos').insert({ company_id:$('apCo').value, data:$('apData').value||todayStr(), minutos, atividade:$('apAt').value,
      descricao:$('apDesc').value.trim()||null, task_id:p.task_id||null });
    if(error){ $('mSave').disabled=false; toast('Erro: '+error.message,'err'); return; }
    if(p.doTimer) timerSet(null);
    closeModal(); toast(`${fmtMin(minutos)} apontado(s).`); if(currentView==='rentabilidade') loadRentabilidade();
  };
}
function openContrato(co, atual){
  $('modalRoot').innerHTML=`<div class="overlay"><div class="modal sm"><div class="modal-h"><h2>Contrato — ${esc(coName(co))}</h2><button class="x" id="mx">×</button></div>
    <div class="modal-b"><div class="field"><label>Honorário mensal (R$)</label><input id="ctHon" type="number" step="0.01" min="0" value="${atual?atual.honorario_mensal:''}"></div>
      <div class="row2"><div class="field"><label>Início</label><input id="ctIni" type="date" value="${atual?atual.inicio:todayStr().slice(0,8)+'01'}"></div>
        <div class="field"><label>Fim (opcional)</label><input id="ctFim" type="date" value="${atual&&atual.fim?atual.fim:''}"></div></div>
      <div class="field"><label>Observação</label><input id="ctObs" value="${esc(atual&&atual.observacao||'')}" placeholder="Ex.: inclui 1 visita por mês"></div></div>
    <div class="modal-f"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn" id="mSave">Salvar</button></div></div></div>`;
  $('mx').onclick=$('mCancel').onclick=closeModal;
  $('mSave').onclick=async ()=>{
    const hon=Number($('ctHon').value); if(!(hon>=0) || $('ctHon').value===''){ toast('Informe o honorário.','err'); return; }
    if($('ctFim').value && $('ctFim').value<$('ctIni').value){ toast('O fim não pode ser antes do início.','err'); return; }
    const { error }=await db.from('bpo_contratos').upsert({ company_id:co, honorario_mensal:hon, inicio:$('ctIni').value, fim:$('ctFim').value||null, observacao:$('ctObs').value.trim()||null });
    if(error){ toast('Erro: '+error.message,'err'); return; }
    closeModal(); toast('Contrato salvo.'); loadRentabilidade();
  };
}
async function renderRentabilidade(){
  const t=timerGet();
  $('main').innerHTML=`<div class="page-h"><h1>Rentabilidade do BPO</h1><div class="spacer"></div>
    <div class="hbtns">${t?`<button class="btn ghost" id="rbTimer">⏹ Parar cronômetro (${fmtMin((Date.now()-t.inicio)/60000)})</button>`:'<button class="btn ghost" id="rbTimer">⏱ Iniciar cronômetro</button>'}
    <button class="btn" id="rbApontar">+ Apontar horas</button></div></div>
    <div class="updated">Quanto cada cliente paga × quanto tempo sua equipe dedica. Honorários e custo/hora só aparecem para administrador e gestor.</div>
    <div class="filters">
      <div class="fg"><label>Ano</label><input id="rbAno" type="number" value="${rbAno}" style="max-width:110px"></div>
      <div class="fg"><label>Período</label><select id="rbMes"><option value="0">Ano todo</option>${MES3.map((m,i)=>`<option value="${i+1}" ${rbMes===i+1?'selected':''}>${MESNOME[i]}</option>`).join('')}</select></div>
    </div><div id="rbArea"><div class="loading">Carregando…</div></div>`;
  $('rbTimer').onclick=()=>timerGet()?pararTimer():iniciarTimer();
  $('rbApontar').onclick=()=>openApontamento();
  $('rbAno').onchange=e=>{ rbAno=+e.target.value||rbAno; loadRentabilidade(); };
  $('rbMes').onchange=e=>{ rbMes=+e.target.value; loadRentabilidade(); };
  await loadRentabilidade();
}
async function loadRentabilidade(){
  $('rbArea').innerHTML='<div class="loading">Calculando…</div>';
  try{
    const ini=mesIni(rbAno,rbMes||1), fim=mesIni(rbAno,rbMes||12), [ny,nm]=addMes(rbAno,rbMes||12,1);
    const [rent,cfg,ger,aps,cts]=await Promise.all([
      db.rpc('rentabilidade_bpo',{ p_ini:ini, p_fim:fim }),
      db.from('app_config').select('valor').eq('chave','custo_hora').maybeSingle(),
      db.rpc('is_gestor'),
      db.from('bpo_apontamentos').select('id,company_id,data,minutos,atividade,descricao,user_id,profiles(nome,email)').gte('data',ini).lt('data',`${ny}-${String(nm).padStart(2,'0')}-01`).order('data',{ascending:false}).limit(300),
      db.from('bpo_contratos').select('*'),
    ]);
    for(const r of [rent,ger,aps]) if(r.error) throw r.error;
    rbGestor=!!ger.data;
    const custoH=Number(cfg.data&&cfg.data.valor||0);
    const contratos=Object.fromEntries((cts.data||[]).map(c=>[c.company_id,c]));
    const L=(rent.data||[]).map(r=>{ const h=Number(r.minutos)/60, hon=Number(r.honorario), custo=h*custoH, mg=hon-custo;
      return {...r, horas:h, hon, custo, mg, pct:hon?mg/hon*100:null, rph:h?hon/h:null, vol:Number(r.titulos)+Number(r.conciliados)}; })
      .sort((a,b)=>rbGestor?(a.tem_contrato===b.tem_contrato?b.mg-a.mg:(a.tem_contrato?-1:1)):b.horas-a.horas);
    const T=L.reduce((s,r)=>({hon:s.hon+r.hon,horas:s.horas+r.horas,custo:s.custo+r.custo,mg:s.mg+r.mg}),{hon:0,horas:0,custo:0,mg:0});
    const per=rbMes?`${MESNOME[rbMes-1]}/${rbAno}`:`Ano ${rbAno}`;
    let html='';
    if(rbGestor){
      const prej=L.filter(r=>r.tem_contrato&&r.mg<0);
      html+=`<div class="box" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">Custo/hora da equipe (salário + encargos + estrutura ÷ horas produtivas): R$
        <input id="rbCusto" type="number" step="0.01" min="0" value="${custoH||''}" style="width:110px;padding:6px 8px"> <button class="btn ghost" id="rbCustoSalvar">Salvar</button>
        ${!custoH?'<span style="color:var(--amber)">⚠️ Defina o custo/hora pra calcular a margem.</span>':''}</div>`;
      if(prej.length) html+=`<div class="box warnbox" style="margin-bottom:12px">⚠️ ${prej.length} cliente(s) dando <b>prejuízo</b> em ${per}: ${prej.map(r=>esc(r.empresa)).join(', ')}. Reveja o honorário ou o escopo.</div>`;
      html+=`<div class="cards">
        <div class="kpi"><div class="lbl">Receita do BPO (honorários)</div><div class="val">${money(T.hon)}</div></div>
        <div class="kpi"><div class="lbl">Horas apontadas</div><div class="val">${fmtMin(T.horas*60)}</div></div>
        <div class="kpi"><div class="lbl">Custo das horas</div><div class="val">${money(T.custo)}</div></div>
        <div class="kpi"><div class="lbl">Margem</div><div class="val ${T.mg<0?'neg':'pos'}">${money(T.mg)}</div><div class="meta">${T.hon?fmtPct(T.mg/T.hon*100)+' dos honorários':''}</div></div>
        <div class="kpi"><div class="lbl">R$ por hora (média)</div><div class="val">${T.horas?money(T.hon/T.horas):'—'}</div></div></div>`;
    }
    const linhas=L.map(r=>`<tr><td><b>${esc(r.empresa)}</b>${rbGestor&&contratos[r.company_id]?`<div class="dre-av">${money(contratos[r.company_id].honorario_mensal)}/mês</div>`:''}</td>
      ${rbGestor?`<td class="r">${r.tem_contrato?money(r.hon):'<span style="color:var(--muted)">sem contrato</span>'}</td>`:''}
      <td class="r">${fmtMin(r.minutos)}</td>
      ${rbGestor?`<td class="r">${money(r.custo)}</td><td class="r ${r.mg<0?'dre-neg':'dre-pos'}"><b>${r.tem_contrato?money(r.mg):'—'}</b></td><td class="r">${r.pct!=null?fmtPct(r.pct):'—'}</td><td class="r">${r.rph!=null?money(r.rph):'—'}</td>`:''}
      <td class="r">${r.titulos}</td><td class="r">${r.conciliados}</td><td class="r">${r.horas?(r.vol/r.horas).toFixed(1).replace('.',','):'—'}</td>
      ${rbGestor?`<td><button class="lnk" data-rbct="${r.company_id}">${r.tem_contrato?'Contrato':'Definir contrato'}</button></td>`:''}</tr>`).join('');
    // empresas sem nada no período mas que o gestor pode querer contratar
    const semLinha=rbGestor?companies.filter(c=>!L.some(r=>r.company_id===c.id)):[];
    html+=`<div class="panel" style="margin-top:16px"><h3><span class="dot t"></span>Por cliente · ${per}</h3>
      ${L.length?`<div style="overflow-x:auto"><table><thead><tr><th>Cliente</th>${rbGestor?'<th class="r">Honorário</th>':''}<th class="r">Horas</th>${rbGestor?'<th class="r">Custo</th><th class="r">Margem</th><th class="r">Margem %</th><th class="r">R$/hora</th>':''}<th class="r">Títulos lançados</th><th class="r">Conciliados</th><th class="r">Itens/hora</th>${rbGestor?'<th></th>':''}</tr></thead><tbody>${linhas}</tbody></table></div>`:'<div class="empty">Nada no período. Defina contratos e aponte horas.</div>'}
      ${semLinha.length?`<div class="hint" style="margin-top:8px">Sem contrato nem movimento no período: ${semLinha.map(c=>`<button class="lnk" data-rbct="${c.id}">${esc(c.nome_fantasia||c.razao_social)}</button>`).join(' · ')}</div>`:''}</div>`;
    if(rbGestor && L.some(r=>r.tem_contrato)){
      const lc=L.filter(r=>r.tem_contrato);
      html+=`<div class="panel" style="margin-top:16px"><h3><span class="dot t"></span>Honorário × custo das horas</h3>${svgChart({ labels:lc.map(r=>r.empresa.length>14?r.empresa.slice(0,13)+'…':r.empresa),
        series:[{nome:'Honorário',cor:'var(--teal)',vals:lc.map(r=>r.hon)},{nome:'Custo das horas',cor:'var(--amber)',vals:lc.map(r=>r.custo)}] })}</div>`;
    }
    const ap=(aps.data||[]);
    const porAt={}; ap.forEach(a=>porAt[a.atividade]=(porAt[a.atividade]||0)+a.minutos);
    html+=`<div class="panel" style="margin-top:16px"><h3><span class="dot a"></span>Apontamentos · ${per}</h3>
      ${Object.keys(porAt).length?`<div class="hint" style="margin-bottom:8px">Por atividade: ${Object.entries(porAt).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${ATIV_LBL[k]} ${fmtMin(v)}`).join(' · ')}</div>`:''}
      ${ap.length?`<table><thead><tr><th>Data</th><th>Cliente</th><th>Atividade</th><th class="r">Tempo</th>${rbGestor?'<th>Usuário</th>':''}<th>Descrição</th><th></th></tr></thead><tbody>
      ${ap.map(a=>`<tr><td>${fmtDate(a.data)}</td><td>${esc(coName(a.company_id))}</td><td>${ATIV_LBL[a.atividade]||a.atividade}</td><td class="r">${fmtMin(a.minutos)}</td>${rbGestor?`<td>${a.profiles?esc(a.profiles.nome||a.profiles.email):'—'}</td>`:''}<td style="font-size:13px">${esc(a.descricao||'')}</td>
        <td>${(a.user_id===userId||rbGestor)?`<button class="lnk del" data-rbdel="${a.id}">Excluir</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum apontamento no período.</div>'}</div>`;
    $('rbArea').innerHTML=html;
    if($('rbCustoSalvar')) $('rbCustoSalvar').onclick=async ()=>{ const v=Number($('rbCusto').value); if(!(v>=0)){ toast('Valor inválido.','err'); return; }
      const { error }=await db.rpc('salvar_config',{ p_chave:'custo_hora', p_valor:v }); if(error){ toast('Erro: '+error.message,'err'); return; } toast('Custo/hora salvo.'); loadRentabilidade(); };
    $('rbArea').querySelectorAll('[data-rbct]').forEach(b=>b.onclick=()=>openContrato(b.dataset.rbct, contratos[b.dataset.rbct]));
    $('rbArea').querySelectorAll('[data-rbdel]').forEach(b=>b.onclick=async ()=>{ const ok=await confirmModal({titulo:'Excluir apontamento',texto:'Excluir este apontamento de horas?',ok:'Excluir',perigo:true}); if(!ok) return;
      const { error }=await db.from('bpo_apontamentos').delete().eq('id',b.dataset.rbdel); if(error){ toast('Erro: '+error.message,'err'); return; } toast('Apontamento excluído.'); loadRentabilidade(); });
  }catch(err){ $('rbArea').innerHTML=`<div class="panel"><div class="empty">Erro: ${esc(err.message||err)}<br>Rodou o candidus_rentabilidade.sql?</div></div>`; }
}

/* ===================== EXTRATO DA CONTA ===================== */
let exAcc='', exIni='', exFim='', exDados=null, exContas=[];
async function renderExtrato(){
  const h=todayStr(); if(!exIni){ exIni=h.slice(0,8)+'01'; exFim=h; }
  $('main').innerHTML=`<div class="page-h"><h1>Extrato da conta</h1><span class="scope">${companyId?'':'· todas as empresas'}</span><div class="spacer"></div>
    <button class="btn ghost" id="exCsv">Exportar Excel (CSV)</button></div>
    <div class="updated">Movimentos da conta como no extrato do banco, com saldo dia a dia. Use a conferência pra bater o saldo do sistema com o do banco.</div>
    <div class="filters">
      <div class="fg"><label>Conta</label><select id="exAcc" style="min-width:260px"><option value="">Carregando…</option></select></div>
      <div class="fg"><label>De</label><input id="exIni" type="date" value="${exIni}"></div>
      <div class="fg"><label>Até</label><input id="exFim" type="date" value="${exFim}"></div>
    </div><div id="exArea"><div class="loading">Carregando…</div></div>`;
  const { data, error }=await scopeQ(db.from('financial_accounts').select('id,nome,banco,company_id,tipo').neq('tipo','cartao_credito')).order('nome');
  if(error){ $('exArea').innerHTML=`<div class="panel"><div class="empty">Erro: ${esc(error.message)}</div></div>`; return; }
  exContas=data||[];
  if(!exContas.length){ $('exAcc').innerHTML='<option value="">—</option>'; $('exArea').innerHTML='<div class="panel"><div class="empty">Nenhuma conta bancária cadastrada (Cadastros → Contas financeiras).</div></div>'; return; }
  if(!exContas.some(c=>c.id===exAcc)) exAcc=exContas[0].id;
  $('exAcc').innerHTML=exContas.map(c=>`<option value="${c.id}" ${c.id===exAcc?'selected':''}>${companyId?'':esc(coName(c.company_id))+' · '}${esc(c.nome)}${c.banco?' ('+esc(c.banco)+')':''}</option>`).join('');
  $('exAcc').onchange=e=>{ exAcc=e.target.value; loadExtrato(); };
  $('exIni').onchange=e=>{ exIni=e.target.value||exIni; loadExtrato(); };
  $('exFim').onchange=e=>{ exFim=e.target.value||exFim; loadExtrato(); };
  $('exCsv').onclick=exportExtratoCsv;
  await loadExtrato();
}
// saldo corrido: só entra no saldo quem tem sentido (entrada/saída na conta)
function extratoLinhas(D){
  let s=Number(D.saldo_anterior||0), ent=0, sai=0;
  const linhas=(D.movimentos||[]).map(m=>{ const v=Number(m.valor||0);
    if(m.sentido==='entrada'){ s+=v; ent+=v; } else if(m.sentido==='saida'){ s-=v; sai+=v; }
    return {...m, v, saldo:s}; });
  return {linhas, ent, sai, fim:s};
}
async function loadExtrato(){
  if(exFim<exIni){ toast('A data final é antes da inicial.','err'); return; }
  $('exArea').innerHTML='<div class="loading">Carregando…</div>';
  try{
    const [ex,imp,conf]=await Promise.all([
      db.rpc('extrato_conta',{ p_account:exAcc, p_ini:exIni, p_fim:exFim }),
      db.from('import_batches').select('created_at,nome_arquivo,origem,periodo_inicio,periodo_fim,qtd_total,qtd_importadas,qtd_duplicadas,profiles(nome,email)').eq('financial_account_id',exAcc).order('created_at',{ascending:false}).limit(15),
      db.from('conferencias_saldo').select('data_ref,saldo_banco,saldo_sistema,diferenca,observacao,created_at,profiles(nome,email)').eq('financial_account_id',exAcc).order('created_at',{ascending:false}).limit(10),
    ]);
    if(ex.error) throw ex.error;
    exDados=ex.data; drawExtrato(imp.data||[], conf.data||[]);
  }catch(err){ exDados=null; $('exArea').innerHTML=`<div class="panel"><div class="empty">Erro: ${esc(err.message||err)}<br>Rodou o candidus_extrato.sql?</div></div>`; }
}
function drawExtrato(imps, confs){
  const D=exDados, X=extratoLinhas(D), c=D.conta;
  const quem=p=>p&&p.profiles?esc(p.profiles.nome||p.profiles.email):'—';
  const dt=s=>s?new Date(s).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'';
  let avisos='';
  if(D.truncado) avisos+=`<div class="box warnbox" style="margin-bottom:10px">⚠️ O período tem ${D.total_periodo} movimentos; mostrando os primeiros 5.000. Diminua o período pra ver tudo (os totais abaixo consideram só os exibidos).</div>`;
  if(Number(D.antes_saldo_inicial)) avisos+=`<div class="box warnbox" style="margin-bottom:10px">⚠️ ${D.antes_saldo_inicial} movimento(s) com data anterior ao saldo inicial (${fmtDate(c.data_saldo_inicial)}) estão somando no saldo. Confira se o saldo inicial cadastrado já não os inclui.</div>`;
  if(Number(D.sem_sentido)) avisos+=`<div class="box warnbox" style="margin-bottom:10px">⚠️ ${D.sem_sentido} transferência(s) antiga(s) sem registro de entrada/saída não entram no saldo desta conta (aparecem marcadas na lista).</div>`;
  const status=m=>{
    if(m.tipo==='transferencia') return `<span class="pill st-recebido_parcial">Transferência</span>${m.sentido?` <button class="lnk" data-exdesf="${m.id}" title="Volta a ser ${m.sentido} e reaparece na conciliação">desfazer</button>`:' <span class="dre-av">sem sentido</span>'}`;
    if(m.conciliado) return `<span class="pill st-recebido">Conciliado</span>${m.regra?`<div class="dre-av">regra: ${esc(m.regra)}</div>`:''}`;
    return m.origem==='importado'?'<span class="pill st-vencido">Pendente</span>':'<span class="pill st-a_receber">Lançado</span>';
  };
  const linhas=X.linhas.map(m=>`<tr${m.sentido?'':' style="opacity:.6"'}><td>${fmtDate(m.data)}</td><td>${esc(m.descricao||'—')}</td>
    <td class="r" style="color:var(--green)">${m.sentido==='entrada'?money(m.v):''}</td><td class="r" style="color:var(--red)">${m.sentido==='saida'?money(m.v):''}</td>
    <td class="r ${m.saldo<0?'dre-neg':''}">${money(m.saldo)}</td><td>${status(m)}</td></tr>`).join('');
  const pend=X.linhas.filter(m=>!m.conciliado && m.tipo!=='transferencia' && m.origem==='importado').length;
  $('exArea').innerHTML=`${avisos}<div class="cards">
      <div class="kpi"><div class="lbl">Saldo anterior (${fmtDate(exIni)})</div><div class="val ${D.saldo_anterior<0?'neg':''}">${money(D.saldo_anterior)}</div></div>
      <div class="kpi"><div class="lbl">Entradas</div><div class="val pos">${money(X.ent)}</div></div>
      <div class="kpi"><div class="lbl">Saídas</div><div class="val neg">${money(X.sai)}</div></div>
      <div class="kpi"><div class="lbl">Saldo final no sistema (${fmtDate(exFim)})</div><div class="val ${X.fim<0?'neg':''}">${money(X.fim)}</div><div class="meta">${X.linhas.length} movimento(s)${pend?` · ${pend} pendente(s) de conciliação`:''}</div></div>
    </div>
    <div class="panel" style="margin-top:16px"><h3><span class="dot a"></span>Conferência com o banco</h3>
      <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
        <div class="field" style="margin:0"><label>Saldo no extrato do banco em ${fmtDate(exFim)}</label><input id="exBanco" type="number" step="0.01" style="width:180px" placeholder="0,00"></div>
        <button class="btn ghost" id="exConferir">Conferir</button>
        <div id="exResult" style="flex:1;min-width:240px"></div>
      </div>
      ${confs.length?`<table style="margin-top:12px"><thead><tr><th>Conferido em</th><th>Data do saldo</th><th class="r">Banco</th><th class="r">Sistema</th><th class="r">Diferença</th><th>Por</th><th>Obs.</th></tr></thead><tbody>
        ${confs.map(x=>`<tr><td>${dt(x.created_at)}</td><td>${fmtDate(x.data_ref)}</td><td class="r">${money(x.saldo_banco)}</td><td class="r">${money(x.saldo_sistema)}</td>
          <td class="r ${Math.abs(x.diferenca)>0.005?'dre-neg':'dre-pos'}">${Math.abs(x.diferenca)>0.005?money(x.diferenca):'✅ bateu'}</td><td>${quem(x)}</td><td style="font-size:13px">${esc(x.observacao||'')}</td></tr>`).join('')}</tbody></table>`:''}
    </div>
    <div class="panel" style="margin-top:16px"><h3><span class="dot t"></span>${esc(c.nome)}${c.banco?' · '+esc(c.banco):''}${c.agencia?' · ag. '+esc(c.agencia):''}${c.numero?' · c/c '+esc(c.numero):''}</h3>
      ${X.linhas.length?`<div style="overflow-x:auto"><table><thead><tr><th>Data</th><th>Descrição</th><th class="r">Entrada</th><th class="r">Saída</th><th class="r">Saldo</th><th>Situação</th></tr></thead>
      <tbody><tr class="dre-sub"><td>${fmtDate(exIni)}</td><td>Saldo anterior</td><td></td><td></td><td class="r">${money(D.saldo_anterior)}</td><td></td></tr>${linhas}
      <tr class="dre-sub"><td>${fmtDate(exFim)}</td><td>Saldo final</td><td class="r">${money(X.ent)}</td><td class="r">${money(X.sai)}</td><td class="r">${money(X.fim)}</td><td></td></tr></tbody></table></div>`
      :'<div class="empty">Nenhum movimento nesta conta no período.</div>'}
    </div>
    <div class="panel" style="margin-top:16px"><h3><span class="dot g"></span>Importações desta conta</h3>
      ${imps.length?`<table><thead><tr><th>Quando</th><th>Arquivo</th><th>Período do arquivo</th><th class="r">No arquivo</th><th class="r">Importados</th><th class="r">Duplicados</th><th>Por</th></tr></thead><tbody>
      ${imps.map(b=>`<tr><td>${dt(b.created_at)}</td><td>${esc(b.nome_arquivo||'—')} <span class="dre-av">${(b.origem||'').toUpperCase()}</span></td><td>${b.periodo_inicio?fmtDate(b.periodo_inicio)+' a '+fmtDate(b.periodo_fim):'—'}</td>
        <td class="r">${b.qtd_total}</td><td class="r">${b.qtd_importadas}</td><td class="r ${b.qtd_duplicadas?'dre-neg':''}">${b.qtd_duplicadas}</td><td>${quem(b)}</td></tr>`).join('')}</tbody></table>`
      :'<div class="empty">Nenhum extrato importado nesta conta ainda.</div>'}
    </div>`;
  $('exConferir').onclick=()=>{
    const vb=$('exBanco').value; if(vb===''){ toast('Digite o saldo que aparece no extrato do banco.','err'); return; }
    const banco=Number(vb), dif=Math.round((banco-X.fim)*100)/100;
    $('exResult').innerHTML=Math.abs(dif)<0.005
      ?`<span style="color:var(--green);font-weight:600">✅ Bateu! Saldo do sistema = saldo do banco.</span> <button class="lnk" id="exReg">Registrar conferência</button>`
      :`<span style="color:var(--red);font-weight:600">⚠️ Diferença de ${money(dif)}</span> <span class="dre-av">(banco − sistema)</span>
        <div class="hint" style="margin-top:4px">${dif>0?'O banco tem mais: pode faltar importar uma <b>entrada</b>, ou alguma saída foi lançada a mais/duplicada.':'O sistema tem mais: pode faltar importar uma <b>saída</b> (tarifa, débito automático), ou alguma entrada está duplicada.'} Confira também o saldo inicial da conta.</div>
        <button class="lnk" id="exReg">Registrar conferência com diferença</button>`;
    $('exReg').onclick=async ()=>{
      const obs=Math.abs(dif)<0.005?null:(prompt('Observação sobre a diferença (opcional):','')||null);
      const { error }=await db.from('conferencias_saldo').insert({ company_id:c.company_id, financial_account_id:c.id, data_ref:exFim, saldo_banco:banco, saldo_sistema:Math.round(X.fim*100)/100, observacao:obs });
      if(error){ toast('Erro: '+error.message,'err'); return; } toast('Conferência registrada.'); loadExtrato();
    };
  };
  $('exArea').querySelectorAll('[data-exdesf]').forEach(b=>b.onclick=async ()=>{
    const ok=await confirmModal({titulo:'Desfazer transferência',texto:'O movimento volta a ser entrada/saída comum e reaparece na Conciliação. Confirmar?',ok:'Desfazer'}); if(!ok) return;
    const { error }=await db.rpc('desfazer_transferencia',{ p_bank_transaction_id:b.dataset.exdesf });
    if(error){ toast('Erro: '+error.message,'err'); return; } toast('Transferência desfeita.'); loadExtrato();
  });
}
function exportExtratoCsv(){
  if(!exDados){ toast('Nada pra exportar.','err'); return; }
  const X=extratoLinhas(exDados), c=exDados.conta;
  const rows=[[fmtDate(exIni),'Saldo anterior','','',Number(exDados.saldo_anterior),''],
    ...X.linhas.map(m=>[fmtDate(m.data),m.descricao||'',m.sentido==='entrada'?m.v:'',m.sentido==='saida'?m.v:'',m.saldo,m.tipo==='transferencia'?'Transferência':(m.conciliado?'Conciliado':'Pendente')]),
    [fmtDate(exFim),'Saldo final',X.ent,X.sai,X.fim,'']];
  baixarCsv(`Extrato_${c.nome.replace(/\W+/g,'_')}_${exIni}_${exFim}.csv`, `Extrato — ${c.nome} — ${fmtDate(exIni)} a ${fmtDate(exFim)}`, ['Data','Descrição','Entrada','Saída','Saldo','Situação'], rows);
}

const AL_SEV={critico:{ico:'🔴',nome:'Crítico',cls:'al-crit'},atencao:{ico:'🟡',nome:'Atenção',cls:'al-aten'},info:{ico:'🔵',nome:'Info',cls:'al-info'}};
const AL_TIPOS={saldo:'Saldo negativo / abaixo do mínimo',caixa30:'Caixa negativo em 30 dias',pagar_vencido:'Contas a pagar vencidas',pagar_vencer:'Contas a pagar vencendo',
  receber_vencido:'Contas a receber vencidas',conciliar:'Extrato sem conciliar',extrato:'Extrato desatualizado',conferencia:'Saldo não bate com o banco',
  fechamento:'Mês anterior aberto',sem_categoria:'Lançamentos sem categoria',anomalia:'Gasto fora do padrão',duplicado:'Movimentos duplicados',
  recorrencia:'Recorrências pendentes',tarefas:'Tarefas atrasadas'};
let alertasCache=[], alertasTimer=null, alSevFiltro='';
async function carregarAlertas(){
  try{
    const { data, error }=await db.rpc('alertas',{ p_company:companyId||null });
    if(error) throw error;
    alertasCache=data||[];
  }catch(e){ alertasCache=[]; }
  const n=alertasCache.filter(a=>a.sev!=='info').length, crit=alertasCache.some(a=>a.sev==='critico');
  const b=$('bellBadge'); if(b){ b.textContent=n>99?'99+':(n||''); b.style.display=n?'':'none'; b.classList.toggle('crit',crit); }
  if(!alertasTimer) alertasTimer=setInterval(carregarAlertas,5*60*1000);
  return alertasCache;
}
function alItemHtml(a, comAcoes){
  const s=AL_SEV[a.sev]||AL_SEV.info;
  const val=a.valor!=null?`<b class="${Number(a.valor)<0?'dre-neg':''}">${money(Number(a.valor))}</b>`:'';
  return `<div class="al-item ${s.cls}" ${comAcoes?'':`data-alview="${a.view||''}"`}>
    <div class="al-ico">${s.ico}</div>
    <div class="al-txt"><div class="al-tit">${esc(a.titulo)} ${val}</div><div class="al-det">${companyId?'':`<b>${esc(a.empresa)}</b> · `}${esc(a.detalhe||'')}</div></div>
    ${comAcoes?`<div class="al-act"><button class="mini" data-alir="${a.view||''}">Ir para</button><button class="lnk" data-aldisp="${esc(a.company_id)}|${esc(a.chave)}">Dispensar 7 dias</button></div>`:''}</div>`;
}
async function toggleBell(){
  let p=$('bellPanel');
  if(p){ p.remove(); return; }
  p=document.createElement('div'); p.id='bellPanel'; p.className='bell-panel';
  p.innerHTML='<div class="loading" style="padding:16px">Verificando…</div>'; document.body.appendChild(p);
  await carregarAlertas();
  if(!$('bellPanel')) return;
  const L=alertasCache;
  p.innerHTML=`<div class="bp-h"><b>Alertas</b><span>${L.length?L.length+' no total':''}</span></div>
    <div class="bp-list">${L.length?L.slice(0,8).map(a=>alItemHtml(a,false)).join(''):'<div class="empty" style="padding:20px">Tudo em ordem ✅</div>'}</div>
    <div class="bp-f"><button class="lnk" id="bpTodos">Ver todos os alertas${L.length>8?` (+${L.length-8})`:''}</button></div>`;
  p.querySelectorAll('[data-alview]').forEach(it=>it.onclick=()=>{ p.remove(); if(it.dataset.alview) setView(it.dataset.alview); });
  $('bpTodos').onclick=()=>{ p.remove(); setView('alertas'); };
}
document.addEventListener('click',e=>{ const p=$('bellPanel'); if(p && !p.contains(e.target) && !e.target.closest('#bellBtn')) p.remove(); });
// bloco "Atenção" no topo do dashboard
async function injetarAlertasDashboard(){
  if(currentView!=='dashboard') return;
  await carregarAlertas();
  if(currentView!=='dashboard') return;
  const imp=alertasCache.filter(a=>a.sev!=='info');
  const ph=$('main').querySelector('.page-h'); if(!ph || $('dashAlertas')) return;
  const box=document.createElement('div'); box.id='dashAlertas';
  box.innerHTML=imp.length?`<div class="panel" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0"><span class="dot r"></span>Atenção</h3><button class="lnk" id="daTodos">Ver todos (${alertasCache.length})</button></div>
    <div style="margin-top:8px">${imp.slice(0,5).map(a=>alItemHtml(a,false)).join('')}</div></div>`
    :`<div class="box" style="margin-bottom:16px">✅ Nenhum alerta importante agora.${alertasCache.length?` <button class="lnk" id="daTodos">${alertasCache.length} informativo(s)</button>`:''}</div>`;
  const upd=ph.nextElementSibling&&ph.nextElementSibling.classList.contains('updated')?ph.nextElementSibling:ph;
  upd.after(box);
  box.querySelectorAll('[data-alview]').forEach(it=>it.onclick=()=>{ if(it.dataset.alview) setView(it.dataset.alview); });
  if($('daTodos')) $('daTodos').onclick=()=>setView('alertas');
}
async function renderAlertas(){
  $('main').innerHTML=`<div class="page-h"><h1>Alertas</h1><span class="scope">${companyId?esc(coName(companyId)):'· todas as empresas'}</span><div class="spacer"></div>
    <button class="btn ghost" id="alAtualizar">Atualizar</button></div>
    <div class="updated">Calculados na hora a partir dos dados do sistema. Dispensar esconde só pra você, por 7 dias.</div>
    <div class="seg" style="max-width:520px;margin-bottom:14px">${[['','Todos'],['critico','🔴 Críticos'],['atencao','🟡 Atenção'],['info','🔵 Info']].map(([k,n])=>`<button type="button" data-alsev="${k}" class="${alSevFiltro===k?'on':''}">${n}</button>`).join('')}</div>
    <div id="alArea"><div class="loading">Verificando…</div></div><div id="alCfg"></div>`;
  $('alAtualizar').onclick=()=>loadAlertas();
  document.querySelectorAll('[data-alsev]').forEach(b=>b.onclick=()=>{ alSevFiltro=b.dataset.alsev; document.querySelectorAll('[data-alsev]').forEach(x=>x.classList.toggle('on',x===b)); drawAlertas(); });
  await loadAlertas(); renderAlertasCfg();
}
async function loadAlertas(){ $('alArea').innerHTML='<div class="loading">Verificando…</div>'; await carregarAlertas(); drawAlertas(); }
function drawAlertas(){
  const L=alertasCache.filter(a=>!alSevFiltro||a.sev===alSevFiltro);
  const cont=s=>alertasCache.filter(a=>a.sev===s).length;
  $('alArea').innerHTML=`<div class="cards" style="margin-bottom:14px">${['critico','atencao','info'].map(s=>`<div class="kpi"><div class="lbl">${AL_SEV[s].ico} ${AL_SEV[s].nome}</div><div class="val">${cont(s)}</div></div>`).join('')}</div>
    <div class="panel">${L.length?L.map(a=>alItemHtml(a,true)).join(''):'<div class="empty">Nenhum alerta aqui ✅</div>'}</div>`;
  $('alArea').querySelectorAll('[data-alir]').forEach(b=>b.onclick=()=>{ if(b.dataset.alir) setView(b.dataset.alir); });
  $('alArea').querySelectorAll('[data-aldisp]').forEach(b=>b.onclick=async ()=>{ const [co,ch]=b.dataset.aldisp.split('|');
    const { error }=await db.rpc('dispensar_alerta',{ p_company:co, p_chave:ch, p_dias:7 }); if(error){ toast('Erro: '+error.message,'err'); return; }
    toast('Alerta dispensado por 7 dias.'); loadAlertas(); });
}
async function renderAlertasCfg(){

        <div class="field"><label>Cobrar fechamento do mês anterior a partir do dia</label><input id="acFech" type="number" min="1" max="28" value="${c.dia_fechamento}"></div>
        <div class="field"><label>Anomalia: gasto acima da média em (%)</label><input id="acPct" type="number" min="10" max="1000" value="${c.anomalia_pct}"></div>
        <div class="field"><label>Anomalia: diferença mínima (R$)</label><input id="acMin" type="number" step="0.01" min="0" value="${c.anomalia_min}"></div>
      </div>
      <div class="field"><label>Alertas ligados</label><div class="al-tipos">${Object.entries(AL_TIPOS).map(([k,n])=>`<label class="rel-chk"><input type="checkbox" data-actipo="${k}" ${(c.desativados||[]).includes(k)?'':'checked'}> ${n}</label>`).join('')}</div></div>
      <button class="btn" id="acSalvar">Salvar configuração</button></div>`;
    if($('acCo')) $('acCo').onchange=e=>{ cfgCo=e.target.value; draw(); };
    $('acSalvar').onclick=async ()=>{
      const n=id=>Number($(id).value);
      const payload={ company_id:cfgCo, saldo_minimo:n('acSaldo')||0, dias_vencer:n('acVencer'), dias_conciliar:n('acConc'), dias_extrato:n('acExt'),
        dia_fechamento:n('acFech'), anomalia_pct:n('acPct'), anomalia_min:n('acMin')||0,
        desativados:[...document.querySelectorAll('[data-actipo]')].filter(x=>!x.checked).map(x=>x.dataset.actipo) };
      const { error }=await db.from('alertas_config').upsert(payload);
      if(error){ toast('Erro: '+(error.message.includes('check')?'algum valor está fora do limite permitido':error.message),'err'); return; }
      toast('Configuração salva.'); loadAlertas();
    };
  };
  draw();
}

      <div class="fg"><label>Empresa</label><select id="blCo">${companies.map(c=>`<option value="${c.id}" ${c.id===defaultCo?'selected':''}>${esc(c.nome_fantasia||c.razao_social)}</option>`).join('')}</select></div>
      <div class="fg"><label>Tipo</label><select id="blTipo"><option value="pagar">Contas a pagar</option><option value="receber">Contas a receber</option></select></div>
      <div class="fg"><label>Vencimento</label><select id="blVenc"><option value="todas">Todas em aberto</option><option value="hoje">Até hoje (vencidas + hoje)</option><option value="7">Próximos 7 dias</option><option value="30">Próximos 30 dias</option></select></div>
    </div>
    <div id="blArea"><div class="loading">Carregando…</div></div>`;
  $('blCo').onchange=e=>{blState.co=e.target.value;blState.sel=new Set();loadBaixaLote();};
  $('blTipo').onchange=e=>{blState.tipo=e.target.value;blState.sel=new Set();loadBaixaLote();};
  $('blVenc').onchange=e=>{blState.venc=e.target.value;blState.sel=new Set();loadBaixaLote();};
  await loadBaixaLote();
}
async function loadBaixaLote(){
  $('blArea').innerHTML='<div class="loading">Carregando…</div>';
  try{
    const co=blState.co, tipo=blState.tipo;
    const acc=await db.from('financial_accounts').select('id,nome').eq('company_id',co).neq('tipo','cartao_credito').order('nome');
    blState.accs=acc.data||[];
    let q;
    if(tipo==='receber') q=db.from('receivable_installments').select('id,vencimento,valor,valor_recebido,saldo,status, receivables(descricao,customers(razao_social,nome_fantasia))').eq('company_id',co).in('status',['a_receber','recebido_parcial']);
    else q=db.from('payable_installments').select('id,vencimento,valor,valor_pago,saldo,status, payables(descricao,suppliers(razao_social,nome_fantasia))').eq('company_id',co).in('status',['a_pagar','pago_parcial']);
    if(blState.venc==='hoje') q=q.lte('vencimento',todayStr());
    else if(blState.venc==='7') q=q.lte('vencimento',new Date(Date.now()+7*86400000).toISOString().slice(0,10));
    else if(blState.venc==='30') q=q.lte('vencimento',new Date(Date.now()+30*86400000).toISOString().slice(0,10));
    q=q.order('vencimento').limit(300);
    const { data,error }=await q; if(error) throw error;
    blState.rows=(data||[]).filter(r=>Number(r.saldo)>0).map(r=>{
      const par=tipo==='receber'?r.receivables:r.payables;
      const cp=par&&(tipo==='receber'?par.customers:par.suppliers);
      return {id:r.id, descricao:par&&par.descricao, contraparte:cp&&(cp.nome_fantasia||cp.razao_social)||'—', vencimento:r.vencimento, saldo:Number(r.saldo), vencida:r.vencimento<todayStr()};
    });
    drawBaixaLote();
  }catch(err){ $('blArea').innerHTML=`<div class="panel"><div class="empty">Erro: ${esc(err.message||err)}</div></div>`; }
}
function blTotalSel(){ return blState.rows.filter(r=>blState.sel.has(r.id)).reduce((s,r)=>s+r.saldo,0); }
function drawBaixaLote(){
  if(!blState.rows.length){ $('blArea').innerHTML='<div class="panel"><div class="empty">Nenhuma parcela em aberto para esse filtro.</div></div>'; return; }
  const body=blState.rows.map(r=>`<tr>
    <td><input type="checkbox" data-bl="${r.id}" ${blState.sel.has(r.id)?'checked':''} style="width:16px;height:16px"></td>
    <td>${esc(r.contraparte)}</td><td>${esc(r.descricao||'—')}</td>
    <td>${fmtDate(r.vencimento)}${r.vencida?' <span class="pill st-vencido">vencida</span>':''}</td>
    <td class="r">${money(r.saldo)}</td></tr>`).join('');
  $('blArea').innerHTML=`<div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="lnk" id="blAll">Selecionar todas</button>
      <button class="lnk" id="blVenc2">Só as vencidas</button>
      <button class="lnk" id="blNone">Limpar seleção</button></div>
    <div class="panel"><table><thead><tr><th></th><th>${blState.tipo==='receber'?'Cliente':'Fornecedor'}</th><th>Descrição</th><th>Vencimento</th><th class="r">Saldo</th></tr></thead><tbody>${body}</tbody></table></div>
    <div class="panel" style="margin-top:14px;padding:16px;display:flex;gap:14px;align-items:end;flex-wrap:wrap">
      <div><div style="font-size:12px;color:var(--muted)">Selecionadas</div><div style="font-family:'Space Grotesk';font-size:18px;font-weight:700" id="blResumo">0 · ${money(0)}</div></div>
      <div class="fg" style="min-width:200px"><label>${blState.tipo==='receber'?'Receber na conta':'Pagar da conta'} *</label><select id="blAcc"><option value="">—</option>${blState.accs.map(a=>`<option value="${a.id}">${esc(a.nome)}</option>`).join('')}</select></div>
      <div class="fg"><label>Data *</label><input id="blData" type="date" value="${todayStr()}" style="max-width:170px"></div>
      <div class="spacer" style="flex:1"></div>
      <button class="btn" id="blGo">Dar baixa nas selecionadas</button>
    </div>`;
  const upResumo=()=>{ $('blResumo').textContent=`${blState.sel.size} · ${money(blTotalSel())}`; };
  $('blArea').querySelectorAll('[data-bl]').forEach(c=>c.onchange=()=>{ c.checked?blState.sel.add(c.dataset.bl):blState.sel.delete(c.dataset.bl); upResumo(); });
  $('blAll').onclick=()=>{ blState.rows.forEach(r=>blState.sel.add(r.id)); drawBaixaLote(); };
  $('blVenc2').onclick=()=>{ blState.sel=new Set(blState.rows.filter(r=>r.vencida).map(r=>r.id)); drawBaixaLote(); };
  $('blNone').onclick=()=>{ blState.sel=new Set(); drawBaixaLote(); };
  $('blGo').onclick=confirmarBaixaLote;
  upResumo();
}
async function confirmarBaixaLote(){
  if(!blState.sel.size){ toast('Marque ao menos uma parcela.','err'); return; }
  const acc=$('blAcc').value; if(!acc){ toast('Escolha a conta.','err'); return; }
  const data=$('blData').value||todayStr();
  const alvos=blState.rows.filter(r=>blState.sel.has(r.id));
  const ok=await confirmModal({titulo:'Confirmar baixa em lote',texto:`${alvos.length} parcela(s) · total ${money(blTotalSel())}. ${blState.tipo==='receber'?'Receber na':'Pagar da'} conta selecionada, na data ${fmtDate(data)}. Confirmar?`,ok:'Confirmar'});
  if(!ok) return;
  const fn=blState.tipo==='receber'?'baixar_receivable_installment':'baixar_payable_installment';
  let okc=0, errc=0;
  for(const r of alvos){
    const { error }=await db.rpc(fn,{ p_installment_id:r.id, p_valor:r.saldo, p_financial_account_id:acc, p_data:data });
    if(error) errc++; else okc++;
  }
  toast(`${okc} baixada(s)${errc?` · ${errc} com erro`:''}.`, errc?'err':'ok');
  loadBaixaLote();
}

/* ===================== LANÇAMENTOS RECORRENTES ===================== */
const PERIOD={semanal:'Semanal',quinzenal:'Quinzenal',mensal:'Mensal',trimestral:'Trimestral',anual:'Anual'};
let recRows=[];
async function renderRecorrentes(){
  $('main').innerHTML=`<div class="page-h"><h1>Recorrentes</h1><span class="scope">${companyId?'':'· todas as empresas'}</span><div class="spacer"></div>
    <div class="hbtns"><button class="btn ghost" id="recGerar">Gerar lançamentos pendentes</button><button class="btn" id="recNova">+ Nova recorrência</button></div></div>
    <div class="updated">Contas fixas (aluguel, mensalidades…). O sistema gera o lançamento automaticamente a cada período — inclusive ao abrir o sistema.</div>
    <div id="recArea"><div class="loading">Carregando…</div></div>`;
  $('recNova').onclick=()=>openRecForm(null);
  $('recGerar').onclick=async ()=>{ const { data,error }=await db.rpc('gerar_recorrencias', companyId?{p_company:companyId}:{}); if(error){toast('Erro: '+error.message,'err');return;} toast((data||0)+' lançamento(s) gerado(s).'); loadRecorrentes(); };
  await loadRecorrentes();
}
async function loadRecorrentes(){
  const { data,error }=await scopeQ(db.from('recurring_entries').select('*, customers(razao_social,nome_fantasia), suppliers(razao_social,nome_fantasia)')).order('proxima');
  if(error){ $('recArea').innerHTML=`<div class="panel"><div class="empty">Erro: ${esc(error.message)}</div></div>`; return; }
  recRows=data||[]; drawRecorrentes();
}
function drawRecorrentes(){
  if(!recRows.length){ $('recArea').innerHTML='<div class="panel"><div class="empty">Nenhuma recorrência. Clique em “+ Nova recorrência”.</div></div>'; return; }
  const showCo=!companyId;
  const body=recRows.map((r,i)=>{
    const cp=r.tipo==='receber'?r.customers:r.suppliers;
    const nome=cp&&(cp.nome_fantasia||cp.razao_social)||'—';
    return `<tr>
      <td><span class="pill ${r.tipo==='receber'?'receber':'pagar'}">${r.tipo==='receber'?'Receber':'Pagar'}</span></td>
      <td><b>${esc(r.descricao)}</b>${nome!=='—'?`<br><span style="font-size:12px;color:var(--muted)">${esc(nome)}</span>`:''}</td>
      ${showCo?`<td>${esc(coName(r.company_id))}</td>`:''}
      <td class="r">${money(r.valor)}</td>
      <td>${PERIOD[r.periodicidade]}</td>
      <td>${fmtDate(r.proxima)}</td>
      <td><span class="pill ${r.ativo?'st-recebido':'st-cancelado'}">${r.ativo?'Ativa':'Pausada'}</span></td>
      <td><div class="act"><button class="lnk" data-tog="${i}">${r.ativo?'Pausar':'Ativar'}</button><button class="lnk" data-edit="${i}">Editar</button><button class="lnk del" data-del="${i}">Excluir</button></div></td></tr>`;
  }).join('');
  $('recArea').innerHTML=`<div class="panel"><table><thead><tr><th>Tipo</th><th>Descrição</th>${showCo?'<th>Empresa</th>':''}<th class="r">Valor</th><th>Período</th><th>Próximo</th><th>Status</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`;
  $('recArea').querySelectorAll('[data-tog]').forEach(b=>b.onclick=async ()=>{ const r=recRows[+b.dataset.tog]; const { error }=await db.from('recurring_entries').update({ativo:!r.ativo}).eq('id',r.id); if(error){toast('Erro.','err');return;} loadRecorrentes(); });
  $('recArea').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openRecForm(recRows[+b.dataset.edit]));
  $('recArea').querySelectorAll('[data-del]').forEach(b=>b.onclick=async ()=>{ const r=recRows[+b.dataset.del]; const ok=await confirmModal({titulo:'Excluir recorrência',texto:`Excluir “${r.descricao}”? As contas já geradas continuam no sistema.`,ok:'Excluir',perigo:true}); if(!ok)return; const { error }=await db.from('recurring_entries').delete().eq('id',r.id); if(error){toast('Erro.','err');return;} toast('Excluída.'); loadRecorrentes(); });
}
async function openRecForm(rec){
  const creating=!rec;
  const defaultCo=rec?rec.company_id:(companyId||(companies[0]&&companies[0].id)||'');
  let tipo=rec?rec.tipo:'pagar';
  $('modalRoot').innerHTML=`<div class="overlay"><div class="modal">
    <div class="modal-h"><h2>${creating?'Nova':'Editar'} recorrência</h2><button class="x" id="mx">×</button></div>
    <div class="modal-b">
      <div class="field"><label>Empresa *</label><select id="reCo" ${creating?'':'disabled'}>${companies.map(c=>`<option value="${c.id}" ${c.id===defaultCo?'selected':''}>${esc(c.nome_fantasia||c.razao_social)}</option>`).join('')}</select></div>
      <div class="field"><label>Tipo</label><div class="seg"><button type="button" id="reR" class="${tipo==='receber'?'on':''}">A receber</button><button type="button" id="reP" class="${tipo==='pagar'?'on':''}">A pagar</button></div></div>
      <div class="cadgrid">
        <div class="field" id="reContraWrap"><label id="reContraLbl">Fornecedor</label><select id="reContra"><option value="">—</option></select></div>
        <div class="field"><label>Valor *</label><input id="reVal" type="number" step="0.01" min="0" value="${rec?rec.valor:''}"></div>
        <div class="field" style="grid-column:1/3"><label>Descrição *</label><input id="reDesc" value="${esc(rec?rec.descricao:'')}" placeholder="ex: Aluguel do galpão"></div>
        <div class="field"><label>Categoria</label><select id="reCat"><option value="">—</option></select></div>
        <div class="field"><label>Centro de custo</label><select id="reCC"><option value="">—</option></select></div>
        <div class="field"><label>Conta financeira</label><select id="reAcc"><option value="">—</option></select></div>
        <div class="field"><label>Forma</label><select id="reForma"><option value="">—</option><option value="pix">PIX</option><option value="boleto">Boleto</option><option value="transferencia">Transferência</option><option value="cartao">Cartão</option><option value="dinheiro">Dinheiro</option><option value="outro">Outro</option></select></div>
        <div class="field"><label>Periodicidade *</label><select id="rePer">${Object.entries(PERIOD).map(([k,v])=>`<option value="${k}" ${(rec?rec.periodicidade:'mensal')===k?'selected':''}>${v}</option>`).join('')}</select></div>
        <div class="field"><label>${creating?'Primeiro vencimento *':'Próximo vencimento *'}</label><input id="reIni" type="date" value="${rec?rec.proxima:todayStr()}"></div>
        <div class="field"><label>Encerrar em (opcional)</label><input id="reFim" type="date" value="${rec&&rec.data_fim?rec.data_fim:''}"></div>
      </div>
    </div>
    <div class="modal-f"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn" id="mSave">Salvar</button></div>
  </div></div>`;
  $('mx').onclick=$('mCancel').onclick=closeModal;
  const co=()=> creating?$('reCo').value:rec.company_id;
  let cli=[],forn=[],cats=[];
  async function loadSel(){
    const [c1,c2,c3,c4]=await Promise.all([
      db.from('customers').select('id,razao_social,nome_fantasia').eq('company_id',co()).order('razao_social'),
      db.from('suppliers').select('id,razao_social,nome_fantasia').eq('company_id',co()).order('razao_social'),
      db.from('categories').select('id,nome,tipo').eq('company_id',co()).order('nome'),
      db.from('financial_accounts').select('id,nome').eq('company_id',co()).neq('tipo','cartao_credito').order('nome'),
    ]);
    cli=c1.data||[]; forn=c2.data||[]; cats=c3.data||[];
    $('reCC').innerHTML='<option value="">—</option>'+((await db.from('cost_centers').select('id,nome').eq('company_id',co()).order('nome')).data||[]).map(x=>`<option value="${x.id}" ${rec&&rec.cost_center_id===x.id?'selected':''}>${esc(x.nome)}</option>`).join('');
    $('reAcc').innerHTML='<option value="">—</option>'+(c4.data||[]).map(x=>`<option value="${x.id}" ${rec&&rec.financial_account_id===x.id?'selected':''}>${esc(x.nome)}</option>`).join('');
    refreshContra(); refreshCat();
    if(rec){ $('reForma').value=rec.forma||''; }
  }
  function refreshContra(){
    $('reContraLbl').textContent = tipo==='receber'?'Cliente':'Fornecedor';
    const arr=tipo==='receber'?cli:forn; const cur=rec?(tipo==='receber'?rec.customer_id:rec.supplier_id):null;
    $('reContra').innerHTML='<option value="">—</option>'+arr.map(x=>`<option value="${x.id}" ${cur===x.id?'selected':''}>${esc(x.nome_fantasia||x.razao_social)}</option>`).join('');
  }
  function refreshCat(){ const arr=cats.filter(c=>c.tipo===(tipo==='receber'?'receita':'despesa')); $('reCat').innerHTML='<option value="">—</option>'+arr.map(x=>`<option value="${x.id}" ${rec&&rec.categoria_id===x.id?'selected':''}>${esc(x.nome)}</option>`).join(''); }
  $('reR').onclick=()=>{tipo='receber';$('reR').classList.add('on');$('reP').classList.remove('on');refreshContra();refreshCat();};
  $('reP').onclick=()=>{tipo='pagar';$('reP').classList.add('on');$('reR').classList.remove('on');refreshContra();refreshCat();};
  if(creating) $('reCo').onchange=loadSel;
  await loadSel();
  $('mSave').onclick=async ()=>{
    const desc=$('reDesc').value.trim(), val=parseFloat($('reVal').value);
    if(!desc){toast('Informe a descrição.','err');return;}
    if(!(val>0)){toast('Informe o valor.','err');return;}
    if(!$('reIni').value){toast('Informe o vencimento.','err');return;}
    const payload={ tipo, descricao:desc, valor:val, periodicidade:$('rePer').value,
      customer_id: tipo==='receber'?($('reContra').value||null):null,
      supplier_id: tipo==='pagar'?($('reContra').value||null):null,
      categoria_id:$('reCat').value||null, cost_center_id:$('reCC').value||null,
      financial_account_id:$('reAcc').value||null, forma:$('reForma').value||null,
      data_inicio:$('reIni').value, proxima:$('reIni').value, data_fim:$('reFim').value||null };
    $('mSave').disabled=true;$('mSave').textContent='Salvando…';
    let res;
    if(creating){ payload.company_id=$('reCo').value; res=await db.from('recurring_entries').insert(payload); }
    else { delete payload.data_inicio; res=await db.from('recurring_entries').update(payload).eq('id',rec.id); }
    $('mSave').disabled=false;$('mSave').textContent='Salvar';
    if(res.error){toast('Erro: '+res.error.message,'err');return;}
    closeModal(); toast('Recorrência '+(creating?'criada!':'atualizada!')); loadRecorrentes();
  };
}

boot();
</script>
