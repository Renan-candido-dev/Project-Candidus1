async function lerExtrato(){
  const co=$('impCo').value, acc=$('impAcc').value, f=$('impFile').files[0];
  if(!acc){ toast('Escolha a conta financeira.','err'); return; }
  if(!f){ toast('Selecione o arquivo.','err'); return; }
  impCard={co,acc,nome:f.name,origem:f.name.toLowerCase().endsWith('.ofx')?'ofx':'csv'};
  $('impArea').innerHTML='<div class="loading">Lendo e conferindo…</div>';
  const text=await f.text();
  let rows = impCard.origem==='ofx'?parseOFX(text):parseCSV(text);
  if(!rows.length && impCard.origem==='csv'){ rows=parseOFX(text); if(rows.length) impCard.origem='ofx'; }
  rows=rows.filter(r=>r.valor>0);   // movimento de valor zero não é lançamento
  if(!rows.length){ $('impArea').innerHTML='<div class="panel"><div class="empty">Não consegui ler movimentos nesse arquivo. Se for CSV, confira se tem colunas de Data, Descrição e Valor. OFX costuma funcionar direto.</div></div>'; return; }

  // situação de cada linha conferida pelo SERVIDOR, com a mesma regra que a importação usa
  impCard.linhas=rows.map(r=>({ data:r.data, descricao:r.descricao, documento:r.documento||null, valor:r.valor, tipo:r.tipo, fit_id:r.fit_id||null }));
  const { data:prev, error:pe }=await db.rpc('previa_importacao',{ p_account:acc, p_linhas:impCard.linhas });
  if(pe){ $('impArea').innerHTML=`<div class="panel"><div class="empty">Não consegui conferir o arquivo: ${esc(pe.message||String(pe))}</div></div>`; return; }
  const situacao=new Map((prev||[]).map(x=>[x.i,x.status]));
  impRows=rows.map((r,i)=>{ r.i=i; r.status=situacao.get(i)||'nova'; r.importar=(r.status==='nova'); return r; });
  drawImport();
}

/* ===================== CONCILIAÇÃO ===================== */
let concState={bts:[],abertas:{receber:[],pagar:[]},tab:'conciliar',sel:new Set(),regras:new Map()};
const rnd2=v=>Math.round(Number(v||0)*100)/100;
function daysDiff(a,b){ return Math.abs(Math.round((new Date(a)-new Date(b))/86400000)); }
function nameTokens(s){ return normDesc(s).split(/[^a-z0-9]+/).filter(w=>w.length>=4); }
function descHit(btDesc, nome){ const d=normDesc(btDesc); return nameTokens(nome).some(t=>d.includes(t)); }
function sugerir(bt, lista){ // lista de parcelas abertas (do tipo certo)
  let best=null;
  for(const inst of lista){
    const dif=Math.abs(bt.valor-inst.saldo);
    const pct=inst.saldo>0?dif/inst.saldo:1;
    const prox=daysDiff(bt.data, inst.vencimento)<=5;
    const nome=descHit(bt.descricao, inst.contraparte||'');
    let conf=null, rank=0;
    if(dif<0.01){ if(nome||prox){conf='alta';rank=3;} else {conf='media';rank=2;} }
    else if(pct<=0.02){ if(nome||prox){conf='media';rank=2;} else {conf='baixa';rank=1;} }
    else if(nome){ conf='baixa';rank=1; }
    if(conf){ const score=rank*1000 - dif - daysDiff(bt.data,inst.vencimento)*0.1;
      if(!best || score>best.score) best={inst,conf,score,dif}; }
  }
  return best;
}

// procura 2 a 4 contas cuja soma de saldos bate exatamente com o movimento
function sugerirCombo(bt, lista){
  const alvo=Math.round(bt.valor*100);
  const cands=lista.filter(i=>i.saldo>0 && i.saldo<=bt.valor+0.005)
    .map(i=>({i, nome:descHit(bt.descricao,i.contraparte||''), dd:daysDiff(bt.data,i.vencimento)}))
    .filter(x=>x.nome||x.dd<=10)
    .sort((a,b)=>(Number(b.nome)-Number(a.nome))||(a.dd-b.dd)).slice(0,14);
  const cents=cands.map(x=>Math.round(x.i.saldo*100));
  let best=null; const pick=[];
  (function dfs(start,sum){
    if(pick.length>=2 && sum===alvo){
      const xs=pick.map(k=>cands[k]); const allNome=xs.every(x=>x.nome);
      const score=(allNome?1000:0) - xs.length*10 - xs.reduce((t,x)=>t+x.dd,0)*0.1;
      if(!best||score>best.score) best={itens:xs.map(x=>x.i),conf:allNome?'alta':'media',score};
      return;
    }
    if(pick.length===4) return;
    for(let k=start;k<cands.length;k++){ const t=sum+cents[k]; if(t>alvo) continue; pick.push(k); dfs(k+1,t); pick.pop(); }
  })(0,0);
  return best;
}
function drawConciliar(){
  if(!concState.bts.length){ concState.sel.clear(); $('cncArea').innerHTML='<div class="panel"><div class="empty">Nenhum movimento pendente de conciliação. Importe um extrato primeiro (menu Importar extrato).</div></div>'; return; }
  const vivos=new Set(concState.bts.map(b=>b.id)); for(const id of [...concState.sel]) if(!vivos.has(id)) concState.sel.delete(id);
  const rows=concState.bts.map((bt,i)=>{
    const lista=abertasPara(bt);
    const regra=concState.regras.get(bt.id);
    const sug=regra?null:sugerir(bt,lista); let combo=null;
    if(!regra && (!sug || sug.conf!=='alta')){ const cb=sugerirCombo(bt,lista); if(cb && (!sug || cb.conf==='alta' || sug.conf==='baixa')) combo=cb; }
    bt._sug=combo?null:sug; bt._combo=combo; bt._regra=regra||null;
    let sugHtml;
    if(regra){
      sugHtml=`<span class="pill st-recebido" style="margin-right:4px">Regra</span><b>${esc(regra.regra_nome)}</b> · ${regra.acao==='transferencia'?'marca como transferência':'lança e concilia'}`;
    } else if(combo){
      const nomes=combo.itens.slice(0,3).map(x=>esc(x.descricao||'—')).join(' + ')+(combo.itens.length>3?' + …':'');
      sugHtml=`<span class="pill st-recebido_parcial" style="margin-right:4px">${combo.itens.length} contas</span>${nomes} · ${money(combo.itens.reduce((t,x)=>t+x.saldo,0))} ${confPill(combo.conf)}`;
    } else if(sug){
      sugHtml=`${esc(sug.inst.descricao||'')}${sug.inst.contraparte?' · '+esc(sug.inst.contraparte):''} · venc. ${fmtDate(sug.inst.vencimento)} · ${money(sug.inst.saldo)} ${confPill(sug.conf)}`;
    } else sugHtml='<span style="color:var(--muted)">Sem sugestão</span>';
    return `<tr>
      <td><input type="checkbox" data-sel="${bt.id}" ${concState.sel.has(bt.id)?'checked':''} style="width:16px;height:16px"></td>
      <td>${fmtDate(bt.data)}</td><td>${esc(bt.descricao)}</td>
      <td class="r" style="color:${bt.tipo==='entrada'?'var(--green)':'var(--red)'}">${bt.tipo==='entrada'?'+':'−'} ${money(bt.valor)}</td>
      <td>${sugHtml}</td>
      <td><div class="act">${regra?`<button class="mini" data-regra="${i}">Aplicar regra</button>`:((sug||combo)?`<button class="mini" data-conc="${i}">Conciliar</button>`:'')}<button class="lnk" data-pick="${i}">Escolher</button><button class="lnk" data-novo="${i}">Criar lançamento</button><button class="lnk" data-transf="${i}">Transf.</button></div></td></tr>`;
  }).join('');
  $('cncArea').innerHTML=`<div id="cncSelBar" style="display:none;align-items:center;gap:10px;margin-bottom:10px"></div>
    <div class="panel"><table><thead><tr><th></th><th>Data</th><th>Movimento</th><th class="r">Valor</th><th>Sugestão (conta)</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  $('cncArea').querySelectorAll('[data-sel]').forEach(c=>c.onchange=()=>{ if(c.checked) concState.sel.add(c.dataset.sel); else concState.sel.delete(c.dataset.sel); updSelBar(); });
  $('cncArea').querySelectorAll('[data-conc]').forEach(b=>b.onclick=()=>{ const bt=concState.bts[+b.dataset.conc]; if(bt._combo) conciliarCombo(bt); else conciliar(bt, bt._sug.inst.id); });
  $('cncArea').querySelectorAll('[data-regra]').forEach(b=>b.onclick=()=>aplicarRegras([concState.bts[+b.dataset.regra].id]));
  $('cncArea').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>openPickConc(concState.bts[+b.dataset.pick]));
  $('cncArea').querySelectorAll('[data-novo]').forEach(b=>b.onclick=()=>openCriarLancConc(concState.bts[+b.dataset.novo]));
  $('cncArea').querySelectorAll('[data-transf]').forEach(b=>b.onclick=async ()=>{
    const bt=concState.bts[+b.dataset.transf];
    const ok=await confirmModal({titulo:'Marcar como transferência',texto:'Este movimento vira uma transferência interna — não conta como receita nem despesa e sai da lista de conciliação. Confirmar?',ok:'Marcar'});
    if(!ok) return;
    const { error }=await db.rpc('marcar_transferencia',{ p_bank_transaction_id:bt.id });
    if(error){ toast('Erro: '+error.message,'err'); return; } toast('Marcado como transferência.'); loadConciliacao();
  });
  updSelBar();
}
function updSelBar(){
  const bar=$('cncSelBar'); if(!bar) return;

  bar.style.display='flex';
  bar.innerHTML=`<span style="font-size:13px">${bts.length} movimentos selecionados · total <b>${money(tot)}</b></span>
    <button class="mini" id="cncSelGo">Conciliar com uma conta</button><button class="lnk" id="cncSelClr">Limpar seleção</button>`;

async function conciliar(bt, instId){
  const tipo=bt.tipo==='entrada'?'receber':'pagar';
  const { error }=await db.rpc('conciliar_movimento',{ p_bank_transaction_id:bt.id, p_installment_id:instId, p_tipo:tipo });
  if(error){ toast('Erro: '+error.message,'err'); return; }
  toast('Conciliado!'); loadConciliacao();
}
async function conciliarCombo(bt){
  const c=bt._combo;
  const ok=await confirmModal({titulo:'Conciliar com várias contas',texto:`Baixar ${c.itens.length} contas (${c.itens.map(x=>x.descricao||'—').join(', ')}) com este movimento de ${money(bt.valor)}?`,ok:'Conciliar'});
  if(!ok) return;
  const { error }=await db.rpc('conciliar_movimento_multi',{ p_bank_transaction_id:bt.id, p_itens:c.itens.map(x=>({installment_id:x.id,valor:rnd2(x.saldo)})), p_juros:0, p_multa:0, p_desconto:0 });
  if(error){ toast('Erro: '+error.message,'err'); return; }
  toast(c.itens.length+' contas conciliadas!'); loadConciliacao();
}
async function conciliarAltas(){
  const alvos=concState.bts.filter(bt=>{ const s=sugerir(bt,abertasPara(bt)); return s&&s.conf==='alta'; });
  if(!alvos.length){ toast('Nenhuma sugestão de alta confiança.','err'); return; }
  const ok=await confirmModal({titulo:'Conciliar em massa',texto:`Conciliar ${alvos.length} movimento(s) de alta confiança (1 movimento ↔ 1 conta) automaticamente?`,ok:'Conciliar'});
  if(!ok) return;
  let feitos=0, erros=0;
  for(const bt of alvos){
    const s=sugerir(bt,abertasPara(bt)); if(!s||s.conf!=='alta') continue;
    const tipo=bt.tipo==='entrada'?'receber':'pagar';
    const { error }=await db.rpc('conciliar_movimento',{ p_bank_transaction_id:bt.id, p_installment_id:s.inst.id, p_tipo:tipo });
    if(error){ erros++; continue; } feitos++;
    // remove a parcela usada pra não reusar
    const arr=concState.abertas[tipo]; const idx=arr.findIndex(x=>x.id===s.inst.id); if(idx>=0) arr.splice(idx,1);
  }
  toast(feitos+' conciliado(s)!'+(erros?` ${erros} com erro.`:''), erros?'err':'ok'); loadConciliacao();
}
// 1 movimento → 1 ou várias contas
function openPickConc(bt){
  const V=bt.valor;
  const lista=abertasPara(bt).slice().sort((a,b)=>Math.abs(a.saldo-V)-Math.abs(b.saldo-V));
  const byId=Object.fromEntries(lista.map(x=>[x.id,x]));
  const sel=new Map(); let difT=null, filtro='';
  $('modalRoot').innerHTML=`<div class="overlay"><div class="modal">
    <div class="modal-h"><h2>Conciliar movimento</h2><button class="x" id="mx">×</button></div>
    <div class="modal-b"><div class="box">${fmtDate(bt.data)} · <b>${esc(bt.descricao)}</b> · ${bt.tipo==='entrada'?'entrada':'saída'} de <b>${money(V)}</b><br>Marque uma ou mais contas. O valor de cada uma pode ser ajustado (baixa parcial).</div>
      <input id="pkBusca" placeholder="Buscar conta..." style="margin-bottom:10px">
      <div id="pkList" style="max-height:300px;overflow-y:auto"></div>
      <div id="pkResumo" class="box" style="margin:12px 0 0"></div>
    </div><div class="modal-f"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn" id="pkOk" disabled>Conciliar</button></div></div></div>`;
  $('mx').onclick=$('mCancel').onclick=closeModal;
  const resumo=()=>{
    const S=rnd2([...sel.values()].reduce((t,v)=>t+(Number(v)||0),0)); const D=rnd2(V-S);
    let dif='';
    if(!sel.size) dif='<span style="color:var(--muted)">Nenhuma conta marcada.</span>';
    else if(Math.abs(D)<0.005){ difT=null; dif='<span style="color:var(--green)">Fecha certinho.</span>'; }
    else if(D>0){ if(!['juros','multa'].includes(difT)) difT='juros';
      dif=`Sobram <b>${money(D)}</b> no movimento → lançar como <select id="pkDifT" style="width:auto;display:inline-block"><option value="juros" ${difT==='juros'?'selected':''}>juros</option><option value="multa" ${difT==='multa'?'selected':''}>multa</option></select>`; }
    else { if(!['desconto','parcial'].includes(difT)) difT='parcial';
      dif=`Faltam <b>${money(-D)}</b> para quitar as contas marcadas → <select id="pkDifT" style="width:auto;display:inline-block"><option value="parcial" ${difT==='parcial'?'selected':''}>baixa parcial (a de vencimento mais recente fica em aberto)</option><option value="desconto" ${difT==='desconto'?'selected':''}>desconto (quita todas)</option></select>`; }
    $('pkResumo').innerHTML=`Movimento <b>${money(V)}</b> · Contas marcadas <b>${money(S)}</b> (${sel.size})<br>${dif}`;
    const t=$('pkDifT'); if(t) t.onchange=e=>{ difT=e.target.value; };
    $('pkOk').disabled=!sel.size;
  };
  const draw=()=>{
    const rows=lista.filter(x=>!filtro||((x.descricao||'')+' '+(x.contraparte||'')).toLowerCase().includes(filtro.toLowerCase()));
    $('pkList').innerHTML=rows.length?rows.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;border-top:1px solid var(--line)">
      <label style="display:flex;gap:10px;align-items:center;flex:1;cursor:pointer;margin:0"><input type="checkbox" data-ck="${x.id}" ${sel.has(x.id)?'checked':''} style="width:16px;height:16px">
      <div><div style="font-size:13.5px">${esc(x.descricao||'—')}${x.contraparte?' · '+esc(x.contraparte):''}</div><div style="font-size:12px;color:var(--muted)">venc. ${fmtDate(x.vencimento)} · saldo ${money(x.saldo)}</div></div></label>
      <input type="number" step="0.01" min="0.01" max="${x.saldo}" data-v="${x.id}" value="${sel.has(x.id)?sel.get(x.id):x.saldo}" ${sel.has(x.id)?'':'disabled'} style="width:110px"></div>`).join(''):'<div class="empty">Nenhuma conta aberta encontrada.</div>';
    $('pkList').querySelectorAll('[data-ck]').forEach(c=>c.onchange=()=>{ const id=c.dataset.ck, inp=$('pkList').querySelector(`[data-v="${id}"]`);
      if(c.checked){ sel.set(id, rnd2(Number(inp.value)||byId[id].saldo)); inp.disabled=false; } else { sel.delete(id); inp.disabled=true; } resumo(); });
    $('pkList').querySelectorAll('[data-v]').forEach(inp=>inp.oninput=()=>{ if(sel.has(inp.dataset.v)){ sel.set(inp.dataset.v, Number(inp.value)||0); resumo(); } });
  };
  $('pkBusca').oninput=e=>{ filtro=e.target.value; draw(); };
  draw(); resumo();
  $('pkOk').onclick=async ()=>{
    let itens=[...sel.entries()].map(([id,v])=>({installment_id:id,valor:rnd2(v)}));
    for(const it of itens){ const x=byId[it.installment_id];
      if(!(it.valor>0)){ toast('Valor inválido em “'+(x.descricao||'conta')+'”.','err'); return; }
      if(it.valor>x.saldo+0.005){ toast('“'+(x.descricao||'conta')+'”: valor maior que o saldo ('+money(x.saldo)+').','err'); return; } }
    const S=rnd2(itens.reduce((t,i)=>t+i.valor,0)); const D=rnd2(V-S);
    let juros=0, multa=0, desconto=0;
    if(D>0.005){ if(difT==='multa') multa=D; else juros=D; }
    else if(D<-0.005){
      if(difT==='desconto') desconto=-D;
      else { // baixa parcial: distribui o movimento pelo vencimento mais antigo
        let rest=V; itens.sort((a,b)=>String(byId[a.installment_id].vencimento).localeCompare(String(byId[b.installment_id].vencimento)));
        itens=itens.map(i=>{ const v=rnd2(Math.min(i.valor,rest)); rest=rnd2(rest-v); return {...i,valor:v}; }).filter(i=>i.valor>0);
      }
    }
    $('pkOk').disabled=true; $('pkOk').textContent='Conciliando…';
    const { error }=await db.rpc('conciliar_movimento_multi',{ p_bank_transaction_id:bt.id, p_itens:itens, p_juros:juros, p_multa:multa, p_desconto:desconto });
    if(error){ $('pkOk').disabled=false; $('pkOk').textContent='Conciliar'; toast('Erro: '+error.message,'err'); return; }
    closeModal(); toast(itens.length>1?itens.length+' contas conciliadas!':'Conciliado!'); loadConciliacao();
  };
}

async function openCriarLancConc(bt){
  const tipo=bt.tipo==='entrada'?'receber':'pagar';
  const co=bt.company_id;
  const [cat,cc,cli,forn]=await Promise.all([
    db.from('categories').select('id,nome,tipo').eq('company_id',co).eq('tipo',tipo==='receber'?'receita':'despesa').order('nome'),
    db.from('cost_centers').select('id,nome').eq('company_id',co).order('nome'),
    tipo==='receber'?db.from('customers').select('id,razao_social,nome_fantasia').eq('company_id',co).order('razao_social'):Promise.resolve({data:[]}),
    tipo==='pagar'?db.from('suppliers').select('id,razao_social,nome_fantasia').eq('company_id',co).order('razao_social'):Promise.resolve({data:[]}),
  ]);
  const opt=(arr,lbl)=>'<option value="">—</option>'+(arr.data||[]).map(x=>`<option value="${x.id}">${esc(lbl(x))}</option>`).join('');
  const contraArr = tipo==='receber'?cli:forn;
  $('modalRoot').innerHTML=`<div class="overlay"><div class="modal">
    <div class="modal-h"><h2>Criar lançamento do extrato</h2><button class="x" id="mx">×</button></div>
    <div class="modal-b"><div class="box">${fmtDate(bt.data)} · <b>${esc(bt.descricao)}</b> · ${bt.tipo==='entrada'?'entrada':'saída'} de <b>${money(bt.valor)}</b><br>Cria uma conta a ${tipo} e já concilia este movimento.</div>
      <div class="cadgrid">
        <div class="field" style="grid-column:1/3"><label>Descrição *</label><input id="clDesc" value="${esc(bt.descricao||'')}"></div>
        <div class="field"><label>${tipo==='receber'?'Cliente':'Fornecedor'}</label><select id="clContra">${opt(contraArr,x=>x.nome_fantasia||x.razao_social)}</select></div>
        <div class="field"><label>Categoria</label><select id="clCat">${opt(cat,x=>x.nome)}</select></div>
        <div class="field"><label>Centro de custo</label><select id="clCC">${opt(cc,x=>x.nome)}</select></div>
        <div class="field"><label>Valor</label><input value="${money(bt.valor)}" disabled></div>
      </div>
      <div class="box" style="margin:12px 0 0">
        <label style="display:flex;gap:8px;align-items:center;margin:0 0 8px"><input type="checkbox" id="clRegra" style="width:16px;height:16px"> <b>Criar regra pros próximos</b> (lança igual sozinho quando aparecer de novo)</label>
        <div id="clRegraBox" style="display:none"><label style="font-size:12px">Descrição do extrato contém</label><input id="clRegraTxt" value="${esc(sugerirTextoRegra(bt.descricao))}"></div>
      </div></div>
    <div class="modal-f"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn" id="mSave">Criar e conciliar</button></div>
  </div></div>`;
  $('mx').onclick=$('mCancel').onclick=closeModal;
  $('clRegra').onchange=()=>{ $('clRegraBox').style.display=$('clRegra').checked?'':'none'; };
  $('mSave').onclick=async ()=>{
    const desc=$('clDesc').value.trim(); if(!desc){toast('Informe a descrição.','err');return;}
    const querRegra=$('clRegra').checked, rTxt=$('clRegraTxt').value.trim();
    if(querRegra && !$('clCat').value){ toast('Pra criar a regra, escolha a categoria.','err'); return; }
    if(querRegra && rTxt.length<2){ toast('O texto da regra precisa ter pelo menos 2 caracteres.','err'); return; }
    $('mSave').disabled=true; $('mSave').textContent='Criando…';
    try{
      let rid, instTbl, instFk;
      if(tipo==='receber'){
        const r=await db.rpc('criar_conta_receber',{p_company_id:co,p_customer_id:$('clContra').value||null,p_descricao:desc,p_valor_total:bt.valor,p_primeiro_vencimento:bt.data,p_qtd_parcelas:1,p_intervalo_meses:1,p_categoria_id:$('clCat').value||null,p_cost_center_id:$('clCC').value||null,p_financial_account_id:null,p_documento:null,p_forma_recebimento:null,p_data_emissao:bt.data,p_permitir_duplicada:true});
        if(r.error) throw r.error; rid=r.data; instTbl='receivable_installments'; instFk='receivable_id';
      } else {
        const r=await db.rpc('criar_conta_pagar',{p_company_id:co,p_supplier_id:$('clContra').value||null,p_descricao:desc,p_valor_total:bt.valor,p_primeiro_vencimento:bt.data,p_qtd_parcelas:1,p_intervalo_meses:1,p_categoria_id:$('clCat').value||null,p_cost_center_id:$('clCC').value||null,p_financial_account_id:null,p_documento:null,p_forma_pagamento:null,p_data_emissao:bt.data,p_competencia:null,p_permitir_duplicada:true});
        if(r.error) throw r.error; rid=r.data; instTbl='payable_installments'; instFk='payable_id';
      }
      const inst=await db.from(instTbl).select('id').eq(instFk,rid).limit(1).single();
      if(inst.error) throw inst.error;
      const cc=await db.rpc('conciliar_movimento',{p_bank_transaction_id:bt.id,p_installment_id:inst.data.id,p_tipo:tipo});
      if(cc.error) throw cc.error;
      if(querRegra){
        const rg=await db.from('conciliation_rules').insert({ company_id:co, nome:rTxt, texto:rTxt, tipo_movimento:bt.tipo, acao:'lancar',
          categoria_id:$('clCat').value, cost_center_id:$('clCC').value||null,
          supplier_id:tipo==='pagar'?($('clContra').value||null):null, customer_id:tipo==='receber'?($('clContra').value||null):null, aplicar_auto:true });
        if(rg.error){ closeModal(); toast('Lançamento criado, mas a regra deu erro: '+rg.error.message,'err'); loadConciliacao(); return; }
        closeModal(); toast('Lançamento criado e regra salva! Os outros pendentes iguais já aparecem com "Aplicar regra".'); loadConciliacao(); return;
      }
      closeModal(); toast('Lançamento criado e conciliado!'); loadConciliacao();
    }catch(err){ $('mSave').disabled=false; $('mSave').textContent='Criar e conciliar'; toast('Erro: '+(err.message||err),'err'); }
  };
}
function drawConciliados(){
  const bts=concState.conc||[];
  if(!bts.length){ $('cncArea').innerHTML='<div class="panel"><div class="empty">Nenhum movimento conciliado ainda.</div></div>'; return; }
  const parc=it=>{ const r=it.receivable_installments, p=it.payable_installments, x=r||p; if(!x) return '—';
    const d=(r&&r.receivables&&r.receivables.descricao)||(p&&p.payables&&p.payables.descricao)||'—';
    return `${esc(d)}${x.total_parcelas>1?` (${x.numero}/${x.total_parcelas})`:''} · ${money(it.valor)}`; };
  const rows=bts.map((bt,i)=>{
    const itens=bt.conciliacao_itens||[];
    let contas=itens.length?itens.map(parc).join('<br>'):'<span style="color:var(--muted)">vínculo direto (baixa manual ou conciliação antiga)</span>';
    const aj=[]; if(Number(bt.juros)) aj.push('juros '+money(bt.juros)); if(Number(bt.multa)) aj.push('multa '+money(bt.multa)); if(Number(bt.desconto)) aj.push('desconto '+money(bt.desconto));
    if(aj.length) contas+=`<div style="font-size:12px;color:var(--muted)">${aj.join(' · ')}</div>`;
    if(bt.conciliation_rules) contas+=`<div style="font-size:12px;color:var(--muted)">via regra: ${esc(bt.conciliation_rules.nome)}</div>`;
    return `<tr>
    <td>${fmtDate(bt.data)}</td><td>${esc(bt.descricao)}</td>
    <td class="r" style="color:${bt.tipo==='entrada'?'var(--green)':'var(--red)'}">${bt.tipo==='entrada'?'+':'−'} ${money(bt.valor)}</td>
    <td><span class="pill st-recebido">${bt.tipo==='entrada'?'Receber':'Pagar'}</span></td>
    <td style="font-size:13px">${contas}</td>
    <td><button class="lnk del" data-undo="${i}">Desfazer</button></td></tr>`; }).join('');

    const { error }=await db.rpc('desconciliar_movimento',{ p_bank_transaction_id:bt.id });

/* ===================== REGRAS DE CONCILIAÇÃO ===================== */
const normTxt=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ');
function regraBate(r, bt){
  if(!r.ativo || r.company_id!==bt.company_id) return false;
  if(r.tipo_movimento!=='ambos' && r.tipo_movimento!==bt.tipo) return false;
  if(r.valor_min!=null && bt.valor<Number(r.valor_min)) return false;
  if(r.valor_max!=null && bt.valor>Number(r.valor_max)) return false;
  return normTxt(bt.descricao).includes(normTxt(r.texto).trim());
}
// sugere o "contém" a partir da descrição do extrato: 2 primeiras palavras sem números
function sugerirTextoRegra(desc){
  const w=(desc||'').split(/\s+/).filter(x=>x.length>=3 && !/\d/.test(x));
  return w.slice(0,2).join(' ') || (desc||'').trim().slice(0,20);
}
async function aplicarRegras(ids){
  if(!ids){
    const n=concState.regras.size;
    const ok=await confirmModal({titulo:'Aplicar regras',texto:`Aplicar as regras em ${n} movimento(s) pendente(s)? Regras de lançamento criam a conta já conciliada; regras de transferência marcam o movimento como transferência.`,ok:'Aplicar'});
    if(!ok) return;
  }
  const { data, error }=await db.rpc('aplicar_regras_conciliacao',{ p_company:companyId||null, p_bank_transaction_ids:ids||null, p_somente_auto:false });
  if(error){ toast('Erro: '+error.message,'err'); return; }
  const r=data||{};
  if(r.erros) toast(`${r.aplicados||0} aplicado(s), ${r.erros} com erro: ${(r.mensagens||[])[0]||''}`,'err');
  else toast((r.aplicados||0)+' movimento(s) resolvido(s) por regra!');
  loadConciliacao();
}

/* ===================== LANÇAMENTO EM LOTE ===================== */
// "1.234,56" / "1234,56" / "1234.56" / "R$ 45" → número
function loteValor(s){
  s=String(s==null?'':s).trim().replace(/R\$|\s/g,'');
  if(!s) return NaN;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=Number(s); return isFinite(n)?n:NaN;
}
// "31/10/2026", "31/10/26", "2026-10-31" → "2026-10-31" ('' se inválida)
function loteData(s){
  s=String(s==null?'':s).trim(); let d='', m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) d=`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  else if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2}|\d{4})$/))) d=`${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if(!d) return '';
  const t=new Date(d+'T00:00:00Z'); return (!isNaN(t) && t.toISOString().slice(0,10)===d)?d:'';
}
// acha fornecedor/cliente pelo nome colado
function acharContra(lista, nome){
  const n=normTxt(nome).trim(); if(!n) return null;
  const nm=x=>[normTxt(x.nome_fantasia||''),normTxt(x.razao_social||'')].filter(Boolean);
  return lista.find(x=>nm(x).some(v=>v===n)) || lista.find(x=>nm(x).some(v=>v.includes(n)||n.includes(v))) || null;
}
// texto colado (Excel/Sheets: colunas separadas por TAB, ou ;) → linhas
// colunas: Descrição | Valor | Vencimento | Fornecedor/Cliente (opc.) | Documento (opc.)
// separador da linha: TAB (Excel/Sheets) > ; > |
function sepColagem(l){ return l.includes('\t')?'\t':(l.includes(';')?';':(l.includes('|')?'|':null)); }
function parseColagem(txt){
  const linhas=String(txt||'').split(/\r?\n/).filter(l=>l.trim());
  return linhas.map(l=>{ const sep=sepColagem(l); const c=sep?l.split(sep).map(x=>x.trim()):[l.trim()];
      return {desc:c[0]||'', valor:loteValor(c[1]), venc:loteData(c[2]), contraNome:c[3]||'', doc:c[4]||'', semColunas:!sep}; })
    .filter((r,i)=>!(i===0 && linhas.length>1 && !/\d/.test(linhas[0]))); // pula cabeçalho (1ª linha sem nenhum número)
}
function loteLinhaVazia(r){ return !r.desc && !(r.valor>0) && !r.venc && !r.contra; }
function loteErros(r){
  const e=[]; if(!r.desc.trim()) e.push('desc'); if(!(r.valor>0)) e.push('valor'); if(!r.venc) e.push('venc');
  if(!(r.parc>=1 && r.parc<=360)) e.push('parc'); return e;
}
async function openLote(tipo){

    <div class="modal-h"><h2>Lançamento em lote — contas a ${pagar?'pagar':'receber'}</h2><button class="x" id="mx">×</button></div>
    <div class="modal-b">
      <div class="lote-top">
        <div class="field"><label>Empresa</label><select id="ltCo" ${companyId?'disabled':''}>${companies.map(c=>`<option value="${c.id}" ${c.id===L.co?'selected':''}>${esc(c.nome_fantasia||c.razao_social)}</option>`).join('')}</select></div>

      <td><input data-f="desc" data-i="${i}" value="${esc(r.desc)}" class="${bad('desc')}" style="min-width:180px"></td>

      <td><select data-f="cat" data-i="${i}">${opt(L.cad.cat,x=>x.nome,r.cat)}</select></td>
      <td><select data-f="cc" data-i="${i}">${opt(L.cad.cc,x=>x.nome,r.cc)}</select></td>
      <td><input data-f="valor" data-i="${i}" value="${r.valor>0?String(r.valor.toFixed(2)).replace('.',','):''}" class="r ${bad('valor')}" style="width:100px" placeholder="0,00"></td>
      <td><input data-f="venc" data-i="${i}" type="date" value="${r.venc}" class="${bad('venc')}"></td>
      <td><input data-f="parc" data-i="${i}" type="number" min="1" max="360" value="${r.parc}" class="${bad('parc')}" style="width:56px"></td>
      <td><button class="lnk del" data-rm="${i}" title="Remover linha">✕</button></td></tr>`; }).join('');
    $('ltBody').querySelectorAll('[data-f]').forEach(el=>{
      const ev=el.tagName==='SELECT'||el.type==='date'?'onchange':'oninput';
      el[ev]=()=>{ const r=L.rows[+el.dataset.i], f=el.dataset.f;
        if(f==='valor') r.valor=loteValor(el.value);
        else if(f==='parc') r.parc=parseInt(el.value,10);
        else if(f==='cat'){ r.cat=el.value; const c=L.cad.cat.find(x=>x.id===r.cat), def=c&&c.default_cost_center_id;
          if(!r.cc||r.ccAuto){ r.cc=def||''; r.ccAuto=!!def; const ccSel=el.closest('tr').querySelector('[data-f="cc"]'); if(ccSel) ccSel.value=r.cc; } }
        else if(f==='cc'){ r.cc=el.value; r.ccAuto=false; }
        else { r[f]=el.value; if(f==='contra'){ r.contraMiss=''; el.classList.remove('lote-warn'); const m=el.nextElementSibling; if(m&&m.classList.contains('lote-miss')) m.remove(); } }
        resumo(); };
    });
    $('ltBody').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ L.rows.splice(+b.dataset.rm,1); if(!L.rows.length) L.rows.push(novaLinha()); L.erroLinha=null; draw(); });
    resumo();
  };
  const preencherTopo=()=>{
    $('ltAcc').innerHTML=opt(L.cad.acc,x=>x.nome,'');
    $('ltCatAll').innerHTML=opt(L.cad.cat,x=>x.nome,''); $('ltCCAll').innerHTML=opt(L.cad.cc,x=>x.nome,''); $('ltContraAll').innerHTML=opt(L.cad.contra,nomeC,'');

  $('ltCo').onchange=async ()=>{

    // cadastros mudam com a empresa: limpa o que era da empresa anterior
    L.rows.forEach(r=>{ r.cat=''; r.cc=''; if(r.contra){ r.contra=''; } }); draw();
    toast('Empresa trocada: categoria, centro de custo e '+contraLbl.toLowerCase()+' das linhas foram limpos.');
  };
  $('ltAplicar').onclick=()=>{
    const c=$('ltCatAll').value, cc=$('ltCCAll').value, ct=$('ltContraAll').value;
    if(!c && !cc && !ct){ toast('Escolha pelo menos um campo pra aplicar.','err'); return; }
    const def=c&&(L.cad.cat.find(x=>x.id===c)||{}).default_cost_center_id;
    L.rows.forEach(r=>{ if(c) r.cat=c; if(cc){ r.cc=cc; r.ccAuto=false; } else if(def&&(!r.cc||r.ccAuto)){ r.cc=def; r.ccAuto=true; } if(ct){ r.contra=ct; r.contraMiss=''; } }); draw();

  $('ltLimpar').onclick=()=>{ L.rows=L.rows.filter(r=>!loteLinhaVazia(r)); if(!L.rows.length) L.rows.push(novaLinha()); L.erroLinha=null; draw(); };
  $('ltColarBtn').onclick=()=>{ $('ltColarBox').style.display=''; $('ltColar').focus(); };
  $('ltColarCancel').onclick=()=>{ $('ltColarBox').style.display='none'; };
  $('ltColarOk').onclick=()=>{
    const novas=parseColagem($('ltColar').value);
    if(!novas.length){ toast('Nada reconhecido no texto colado.','err'); return; }
    if(novas.every(n=>n.semColunas)){ toast('Não reconheci as colunas. Copie direto do Excel, ou separe com ; ou | (Descrição ; Valor ; Vencimento).','err'); return; }
    const linhas=novas.map(n=>{ const c=n.contraNome?acharContra(L.cad.contra,n.contraNome):null;
      return {...novaLinha(), desc:n.desc, valor:n.valor, venc:n.venc, doc:n.doc, contra:c?c.id:'', contraMiss:(n.contraNome&&!c)?n.contraNome:''}; });
    L.rows=L.rows.filter(r=>!loteLinhaVazia(r)).concat(linhas);
    $('ltColar').value=''; $('ltColarBox').style.display='none'; L.mostrarErros=true; draw();
    const miss=linhas.filter(l=>l.contraMiss).length, inc=linhas.filter(l=>loteErros(l).length).length;
    toast(`${linhas.length} linha(s) adicionada(s).`+(inc?` ${inc} incompleta(s) (em vermelho).`:'')+(miss?` ${miss} sem ${contraLbl.toLowerCase()} encontrado.`:''), (inc||miss)?'err':'ok');
  };
  $('mSave').onclick=async ()=>{
    L.mostrarErros=true; L.erroLinha=null;
    const idx=L.rows.map((r,i)=>i).filter(i=>!loteLinhaVazia(L.rows[i]));
    if(!idx.length){ toast('Preencha pelo menos uma linha.','err'); return; }
    const ruins=idx.filter(i=>loteErros(L.rows[i]).length);
    if(ruins.length){ draw(); toast(`Linha(s) ${ruins.map(i=>i+1).join(', ')} incompleta(s): descrição, valor e vencimento são obrigatórios.`,'err'); return; }
    // duplicidade dentro do próprio lote
    const visto=new Map(), dupLote=[];
    idx.forEach(i=>{ const r=L.rows[i]; const k=`${r.contra}|${normTxt(r.desc).trim()}|${r.valor.toFixed(2)}|${r.venc}`; if(visto.has(k)) dupLote.push(i+1); else visto.set(k,i); });
    // duplicidade com o que já existe (mesma regra do formulário avulso)
    $('mSave').disabled=true; $('mSave').textContent='Conferindo…';
    const dupBanco=[];
    for(let k=0;k<idx.length;k+=10){
      const parte=idx.slice(k,k+10);

      res.forEach((d,j)=>{ if(d) dupBanco.push(parte[j]+1); });
    }
    $('mSave').disabled=false; resumo();
    if(dupLote.length||dupBanco.length){
      const txt=[dupLote.length?`Repetidas dentro do lote: linha(s) ${dupLote.join(', ')}.`:'', dupBanco.length?`Parecidas com contas que já existem: linha(s) ${dupBanco.join(', ')}.`:''].filter(Boolean).join(' ');
      const ok=await confirmOver({titulo:'Possíveis duplicadas',texto:txt+' Lançar assim mesmo?',ok:'Lançar assim mesmo'});
      if(!ok) return;
    }
    const acc=$('ltAcc').value||null, forma=$('ltForma').value||null, emis=$('ltEmis').value||null;
    const dupConfirmada=!!(dupLote.length||dupBanco.length);  // se chegou aqui com duplicadas, o usuário confirmou
    const itens=idx.map(i=>{ const r=L.rows[i]; return { permitir_duplicada:dupConfirmada, company_id:L.co, contraparte_id:r.contra||null, descricao:r.desc.trim(), valor:Number(r.valor.toFixed(2)),
      vencimento:r.venc, qtd_parcelas:r.parc, intervalo_meses:1, categoria_id:r.cat||null, cost_center_id:r.cc||null,
      financial_account_id:acc, documento:r.doc.trim()||null, forma, data_emissao:emis }; });
    $('mSave').disabled=true; $('mSave').textContent='Lançando…';
    const { data, error }=await db.rpc('criar_contas_lote',{ p_tipo:tipo, p_itens:itens });
    if(error){
      $('mSave').disabled=false; resumo();
      const m=String(error.message||'').match(/^Linha (\d+):/); if(m){ L.erroLinha=idx[+m[1]-1]; draw(); }
      toast('Nada foi lançado. '+(m?`Linha ${idx[+m[1]-1]+1}: `+error.message.replace(/^Linha \d+:\s*/,''):error.message),'err');
      return;
    }
    closeModal(); toast(`${data.criadas} conta(s) lançada(s) · ${money(data.total)}`);
    if(pagar) loadPagar(); else loadReceber();
  };
}

/* ===================== GESTÃO DE CUSTOS ===================== */
const fmtPct=v=>Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';
// --- centro de custo padrão da categoria: preenche sozinho nos formulários ---
const ccPadraoCache={};
async function ccPadraoDe(catId){
  if(!catId) return null;
  if(!(catId in ccPadraoCache)){
    const { data }=await db.from('categories').select('default_cost_center_id').eq('id',catId).maybeSingle();
    ccPadraoCache[catId]=data?data.default_cost_center_id:null;
  }
  return ccPadraoCache[catId];
}
function limparCCPadraoCache(){ Object.keys(ccPadraoCache).forEach(k=>delete ccPadraoCache[k]); }
// só preenche se o centro de custo estiver vazio ou ainda com o valor que ele mesmo preencheu
function ligarCCPadrao(cat, cc){
  if(!cat||!cc||cat.dataset.ccPadrao) return;
  cat.dataset.ccPadrao='1'; let auto='';
  cat.addEventListener('change', async ()=>{
    const def=await ccPadraoDe(cat.value);
    if(cc.value && cc.value!==auto) return;
    if(!def){ if(auto && cc.value===auto){ cc.value=''; auto=''; } return; }
    if(![...cc.options].some(o=>o.value===def)) return;
    cc.value=def; auto=def; cc.dispatchEvent(new Event('change',{bubbles:true}));
  });
}
const CC_PARES=[['nCat','nCC'],['pnCat','pnCC'],['dcCat','dcCC'],['clCat','clCC'],['reCat','reCC'],['rgCat','rgCC']];
new MutationObserver(()=>CC_PARES.forEach(([a,b])=>ligarCCPadrao($(a),$(b)))).observe($('modalRoot'),{childList:true,subtree:true});

// --- rateio por título ---
function rateioLinha(tipo, t){
  const rat=(t.rateio_centro_custo||[]).slice().sort((a,b)=>b.percentual-a.percentual);
  const cc=t.cc_titulo&&t.cc_titulo.nome;
  const txt=rat.length?'Rateio: '+rat.map(r=>`<b>${esc(r.cost_centers?r.cost_centers.nome:'?')}</b> ${fmtPct(r.percentual)}`).join(' · ')
    :'Centro de custo: '+(cc?`<b>${esc(cc)}</b>`:'<span style="color:var(--muted)">não informado</span>');
  return `<tr class="inst-row"><td colspan="8" style="padding-left:38px;font-size:12.5px">${txt}
    <button class="lnk" data-rateio="${t.id}" data-rtipo="${tipo}" style="margin-left:8px">${rat.length?'Editar rateio':'Ratear entre centros de custo'}</button></td></tr>`;
}
function ligarRateio(area, tipo, lista){
  area.querySelectorAll('[data-rateio]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const t=lista.find(x=>x.id===b.dataset.rateio); if(t) openRateio(tipo,t); });
}

/* Cancelar / reativar conta (título). O banco valida perfil, baixas e mês fechado. */
function acoesTituloLinha(tipo, t){
  const pagoKey=tipo==='receber'?'valor_recebido':'valor_pago';
  const cancelaveis=t.parc.filter(p=>p.situacao!=='cancelado'&&Number(p[pagoKey]||0)===0).length;
  const canceladas=t.parc.filter(p=>p.situacao==='cancelado').length;
  let b='';
  if(t.status!=='cancelado'&&cancelaveis>0) b+=`<button class="lnk del" data-cancelar-titulo="${t.id}">Cancelar conta</button>`;
  if(canceladas>0) b+=`<button class="lnk" data-reativar-titulo="${t.id}">${t.status==='cancelado'?'Reativar conta':'Reativar parcelas canceladas'}</button>`;
  if(!b) return '';
  return `<tr class="inst-row"><td colspan="8" style="padding-left:38px;font-size:12.5px"><span style="color:var(--muted);margin-right:8px">Ações da conta:</span>${b}</td></tr>`;
}
function ligarAcoesTitulo(area, tipo, lista, recarregar){
  area.querySelectorAll('[data-cancelar-titulo]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const t=lista.find(x=>x.id===b.dataset.cancelarTitulo); if(t) openMotivoTitulo('cancelar',tipo,t,recarregar); });
  area.querySelectorAll('[data-reativar-titulo]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const t=lista.find(x=>x.id===b.dataset.reativarTitulo); if(t) openMotivoTitulo('reativar',tipo,t,recarregar); });
}
function openMotivoTitulo(acao, tipo, t, recarregar){
  const cancelar=acao==='cancelar';
  const txt=cancelar
    ?'As parcelas sem baixa ficam como <b>Canceladas</b> e saem dos totais, do fluxo e da DRE. Parcelas já '+(tipo==='receber'?'recebidas':'pagas')+' continuam como estão. Fica registrado na auditoria quem cancelou e por quê. Parcela de mês fechado não pode ser cancelada.'
    :'As parcelas canceladas voltam a ficar em aberto. Fica registrado na auditoria quem reativou e por quê.';
  $('modalRoot').innerHTML=`<div class="overlay"><div class="modal sm"><div class="modal-h"><h2>${cancelar?'Cancelar':'Reativar'} conta</h2><button class="x" id="mx">×</button></div>
    <div class="modal-b"><div class="box"><b>${esc(t.descricao)}</b> · ${money(t.valor_total)}<br>${txt}</div>
      <div class="field"><label>Motivo *</label><textarea id="tMot" rows="3" placeholder="${cancelar?'Ex.: cliente desistiu do serviço':'Ex.: cancelada por engano'}"></textarea></div></div>
    <div class="modal-f"><button class="btn ghost" id="mCancel">Voltar</button><button class="btn ${cancelar?'danger':''}" id="mSave">${cancelar?'Cancelar conta':'Reativar'}</button></div></div></div>`;
  $('mx').onclick=$('mCancel').onclick=closeModal;
  $('mSave').onclick=async ()=>{
    const mot=$('tMot').value.trim(); if(mot.length<5){ toast('Informe o motivo (mínimo 5 caracteres).','err'); return; }
    $('mSave').disabled=true;
    const { data, error }=await db.rpc(cancelar?'cancelar_titulo':'reativar_titulo',{ p_tipo:tipo, p_titulo_id:t.id, p_motivo:mot });
    if(error){ $('mSave').disabled=false; toast('Erro: '+error.message,'err'); return; }
    closeModal(); toast(`${data||0} parcela(s) ${cancelar?'cancelada(s)':'reativada(s)'}.`); recarregar();
  };
}
async function openRateio(tipo, t){
  const { data:ccs, error }=await db.from('cost_centers').select('id,nome').eq('company_id',t.company_id).order('nome');
  if(error){ toast('Erro: '+error.message,'err'); return; }
  if(!(ccs||[]).length){ toast('Cadastre os centros de custo dessa empresa primeiro (Cadastros → Centros de custo).','err'); return; }
  const tinha=(t.rateio_centro_custo||[]).length>0;
  let rows=tinha?t.rateio_centro_custo.map(r=>({cc:r.cost_center_id,pct:Number(r.percentual)})):[{cc:t.cost_center_id||'',pct:100}];
  const V=Number(t.valor_total||0);
  $('modalRoot').innerHTML=`<div class="overlay"><div class="modal">
    <div class="modal-h"><h2>Rateio entre centros de custo</h2><button class="x" id="mx">×</button></div>
    <div class="modal-b"><div class="box"><b>${esc(t.descricao)}</b> · ${money(V)}<br>O valor de cada parcela é dividido pelos percentuais nos relatórios de custos. A soma precisa dar 100%.</div>
      <table><thead><tr><th>Centro de custo</th><th class="r" style="width:110px">%</th><th class="r" style="width:130px">Valor</th><th style="width:30px"></th></tr></thead><tbody id="raBody"></tbody></table>
      <div style="display:flex;gap:10px;margin-top:8px"><button class="lnk" id="raAdd">+ centro de custo</button><button class="lnk" id="raIgual">Dividir igual</button></div>
    </div>
    <div class="modal-f"><span id="raTot" style="margin-right:auto;font-size:13px"></span>
      ${tinha?'<button class="btn ghost" id="raDel" style="color:var(--red)">Remover rateio</button>':''}
      <button class="btn ghost" id="mCancel">Cancelar</button><button class="btn" id="mSave">Salvar rateio</button></div></div></div>`;
  $('mx').onclick=$('mCancel').onclick=closeModal;
  const total=()=>Math.round(rows.reduce((s,r)=>s+(Number(r.pct)||0),0)*100)/100;
  const resumo=()=>{ const tt=total(); $('raTot').innerHTML=`Total: <b style="color:${Math.abs(tt-100)<=0.01?'var(--green)':'var(--red)'}">${fmtPct(tt)}</b>${Math.abs(tt-100)>0.01?` (falta ${fmtPct(100-tt)})`:''}`;
    rows.forEach((r,i)=>{ const c=document.querySelector(`[data-raval="${i}"]`); if(c) c.textContent=money(V*(Number(r.pct)||0)/100); }); };
  const draw=()=>{
    $('raBody').innerHTML=rows.map((r,i)=>`<tr>
      <td><select data-racc="${i}"><option value="">— escolha —</option>${ccs.map(c=>`<option value="${c.id}" ${c.id===r.cc?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></td>
      <td><input data-rapct="${i}" type="number" step="0.01" min="0" max="100" value="${r.pct}" class="r"></td>
      <td class="r" data-raval="${i}"></td>
      <td>${rows.length>1?`<button class="lnk del" data-radel="${i}">✕</button>`:''}</td></tr>`).join('');
    $('raBody').querySelectorAll('[data-racc]').forEach(s=>s.onchange=()=>{ rows[+s.dataset.racc].cc=s.value; });
    $('raBody').querySelectorAll('[data-rapct]').forEach(s=>s.oninput=()=>{ rows[+s.dataset.rapct].pct=Number(s.value); resumo(); });
    $('raBody').querySelectorAll('[data-radel]').forEach(b=>b.onclick=()=>{ rows.splice(+b.dataset.radel,1); draw(); });
    resumo();
  };
  draw();
  $('raAdd').onclick=()=>{ const usados=new Set(rows.map(r=>r.cc)); const prox=ccs.find(c=>!usados.has(c.id)); rows.push({cc:prox?prox.id:'',pct:Math.max(0,Math.round((100-total())*100)/100)}); draw(); };
  $('raIgual').onclick=()=>{ const n=rows.length, base=Math.floor(10000/n)/100; rows.forEach((r,i)=>r.pct=i<n-1?base:Math.round((100-base*(n-1))*100)/100); draw(); };
  const salvar=async itens=>{
    $('mSave').disabled=true;
    const { error }=await db.rpc('salvar_rateio',{ p_tipo:tipo, p_titulo_id:t.id, p_itens:itens });
    $('mSave').disabled=false;
    if(error){ toast('Erro: '+error.message,'err'); return; }
    closeModal(); toast(itens.length?'Rateio salvo!':'Rateio removido.'); tipo==='pagar'?loadPagar():loadReceber();
  };
  if(tinha) $('raDel').onclick=async ()=>{ const ok=await confirmOver({titulo:'Remover rateio',texto:'O título volta a contar 100% no centro de custo dele. Confirmar?',ok:'Remover'}); if(ok) salvar([]); };
  $('mSave').onclick=()=>{
    if(rows.some(r=>!r.cc)){ toast('Escolha o centro de custo em todas as linhas.','err'); return; }
    if(new Set(rows.map(r=>r.cc)).size!==rows.length){ toast('O mesmo centro de custo aparece duas vezes.','err'); return; }
    if(rows.some(r=>!(r.pct>0))){ toast('Todo percentual precisa ser maior que zero.','err'); return; }
    if(Math.abs(total()-100)>0.01){ toast('Os percentuais precisam somar 100%.','err'); return; }
    salvar(rows.map(r=>({cost_center_id:r.cc, percentual:r.pct})));
  };
}

// agrupa linhas por categoria-pai → [{key,nome,total,filhos:[{nome,total,direto}]}]
function custosAgrupar(rows){
  const g={};
  rows.forEach(d=>{
    const key=d.categoria_pai_id||d.categoria_id||'_semcat';
    const grp=g[key]||(g[key]={key, nome:d.categoria_pai_id?d.categoria_pai:d.categoria, total:0, filhos:{}});
    grp.total+=d.valor;
    const fk=d.categoria_id||'_semcat';
    const f=grp.filhos[fk]||(grp.filhos[fk]={nome:d.categoria, total:0, direto:!d.categoria_pai_id});
    f.total+=d.valor;
  });
  return Object.values(g).map(x=>({...x, filhos:Object.values(x.filhos).sort((a,b)=>b.total-a.total)})).sort((a,b)=>b.total-a.total);
}
function custosGruposHtml(grupos, prefixo, base){
  return grupos.map(gp=>{
    const unico=gp.filhos.length===1 && gp.filhos[0].direto;
    const k=prefixo+gp.key, open=cuOpen.has(k);
    const pct=base?` <span class="dre-av">${fmtPct(gp.total/base*100)}</span>`:'';
    let h=`<tr class="${unico?'':'title-row'}" ${unico?'':`data-cuk="${esc(k)}"`}><td>${unico?'':`<span class="caret ${open?'open':''}">▶</span>`}${esc(gp.nome)}</td><td class="r">${money(gp.total)}${pct}</td></tr>`;
    if(open && !unico) h+=gp.filhos.map(f=>`<tr class="inst-row"><td style="padding-left:38px">${esc(f.nome)}${f.direto?' <span class="dre-av">(lançado direto no grupo)</span>':''}</td><td class="r">${money(f.total)}${base?` <span class="dre-av">${fmtPct(f.total/base*100)}</span>`:''}</td></tr>`).join('');
    return h;
  }).join('');
}

// CSV genérico pro Excel (; e vírgula decimal, BOM pros acentos)
function baixarCsv(arquivo, titulo, head, rows){
  const q=s=>`"${String(s).replace(/"/g,'""')}"`;
  const cel=v=>typeof v==='number'?(Math.round(v*100)/100).toFixed(2).replace('.',','):q(v);
  const out=[[q(titulo)],head.map(q),...rows.map(r=>r.map(cel))].map(r=>r.join(';')).join('\r\n');
  const blob=new Blob(['\ufeff'+out],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=arquivo; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}

/* ===================== CUSTO FIXO × VARIÁVEL ===================== */
const COMP_LBL={fixo:'Fixo',variavel:'Variável'};
function compPill(c, herdado){
  if(!c) return '<span style="color:var(--muted)">não classificado</span>';
  return `<span class="pill ${c==='fixo'?'st-a_pagar':'st-recebido_parcial'}" ${herdado?'style="opacity:.6" title="Herdado da categoria-pai"':''}>${COMP_LBL[c]}${herdado?' (do pai)':''}</span>`;

async function openFixoVariavel(){
  const { data, error }=await scopeQ(db.from('categories').select('id,nome,parent_id,comportamento,company_id').eq('tipo','despesa')).order('nome');

  const byId=Object.fromEntries(cats.map(c=>[c.id,c]));
  // pai seguido dos filhos
  const ordem=[]; cats.filter(c=>!c.parent_id||!byId[c.parent_id]).forEach(p=>{ ordem.push(p); cats.filter(c=>c.parent_id===p.id).forEach(f=>ordem.push(f)); });

    <div class="modal-b"><div class="box"><b>Variável</b> = acompanha o volume de vendas/serviços (insumos, comissões, frete, impostos sobre venda).
      <b>Fixo</b> = existe mesmo sem vender (aluguel, salários administrativos, contabilidade, sistemas).<br>
      Categoria filha em branco <b>herda do pai</b>. Isso alimenta a margem de contribuição e o ponto de equilíbrio nos Indicadores.</div>
      <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center"><span id="fvResumo" style="font-size:13px;margin-right:auto"></span></div>
      <div style="max-height:52vh;overflow-y:auto"><table><thead><tr>${companyId?'':'<th>Empresa</th>'}<th>Categoria de despesa</th><th style="width:230px">Comportamento</th></tr></thead><tbody id="fvBody"></tbody></table></div>
    </div>
    <div class="modal-f"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn" id="mSave">Salvar</button></div></div></div>`;
  $('mx').onclick=$('mCancel').onclick=closeModal;
  const resumo=()=>{ const n=ordem.filter(c=>efetivo(c)).length; $('fvResumo').innerHTML=`<b>${n}</b> de ${ordem.length} categorias classificadas${n<ordem.length?` · <span style="color:var(--amber)">${ordem.length-n} sem classificação</span>`:' ✓'}`; };
  const draw=()=>{
    $('fvBody').innerHTML=ordem.map(c=>{ const filho=c.parent_id&&byId[c.parent_id]; const pai=filho?novo[c.parent_id]:'';
      return `<tr>${companyId?'':`<td>${esc(coName(c.company_id))}</td>`}<td>${filho?`&nbsp;&nbsp;↳ ${esc(c.nome)}`:`<b>${esc(c.nome)}</b>`}</td>
      <td><select data-fv="${c.id}">
        <option value="">${filho?(pai?`herda do pai (${COMP_LBL[pai]})`:'herda do pai (não classificado)'):'— não classificado —'}</option>
        <option value="fixo" ${novo[c.id]==='fixo'?'selected':''}>Fixo</option>
        <option value="variavel" ${novo[c.id]==='variavel'?'selected':''}>Variável</option></select></td></tr>`; }).join('');
    $('fvBody').querySelectorAll('[data-fv]').forEach(s=>s.onchange=()=>{ novo[s.dataset.fv]=s.value; const temFilhos=cats.some(c=>c.parent_id===s.dataset.fv); if(temFilhos) draw(); else resumo(); });
    resumo();
  };
  draw();
  $('mSave').onclick=async ()=>{
    const itens=cats.filter(c=>(c.comportamento||'')!==novo[c.id]).map(c=>({id:c.id, comportamento:novo[c.id]||null}));
    if(!itens.length){ closeModal(); return; }
    $('mSave').disabled=true;
    const { data:n, error }=await db.rpc('salvar_comportamento_categorias',{ p_itens:itens });
    if(error){ $('mSave').disabled=false; toast('Erro: '+error.message,'err'); return; }
    closeModal(); toast(`${n} categoria(s) atualizada(s).`); if(typeof loadCategorias==='function' && $('catArea')) loadCategorias();
  };
}
// variáveis × fixos no período (custos e despesas operacionais da DRE)
// sem classificação: custo → variável, despesa operacional → fixo (estimativa)
function indCV(data, ini, fim){
  const r={variavel:0, fixo:0, semClass:0};
  data.forEach(d=>{ if(d.mes<ini||d.mes>fim||d.origem!=='pagar') return;
    if(d.natureza!=='custo'&&d.natureza!=='despesa_operacional') return;
    const v=Number(d.valor||0);
    if(d.comportamento==='variavel') r.variavel+=v;
    else if(d.comportamento==='fixo') r.fixo+=v;
    else { r.semClass+=v; if(d.natureza==='custo') r.variavel+=v; else r.fixo+=v; } });
  return r;
}

/* ===================== FLUXO PROJETADO (CENÁRIOS) ===================== */
const PJ_PADRAO={
  otimista:  {nome:'Otimista',  cor:'var(--green)', inad:0,  atraso:0,  recVenc:90, ajS:0},
  realista:  {nome:'Realista',  cor:'var(--teal)',  inad:5,  atraso:10, recVenc:50, ajS:0},
  pessimista:{nome:'Pessimista',cor:'var(--red)',   inad:15, atraso:30, recVenc:20, ajS:10},
};
const PJ_PARAM=[
  ['inad','Inadimplência','% das entradas previstas que não entram'],
  ['atraso','Atraso nos recebimentos','dias que os clientes atrasam, em média'],
  ['recVenc','Vencidos que ainda entram','% do que já está vencido a receber e entra no 1º mês'],
  ['ajS','Variação nas saídas','% a mais (ou a menos) nas saídas previstas'],
];
let pjMeses=6, pjSel='realista', pjBase=null, pjSaldo=0, pjInadAtual=null, pjCen=null;
function pjCarregarCen(){ try{ const s=JSON.parse(localStorage.getItem('candidus_cenarios')||'null'); if(s) return Object.fromEntries(Object.keys(PJ_PADRAO).map(k=>[k,{...PJ_PADRAO[k],...(s[k]||{}),nome:PJ_PADRAO[k].nome,cor:PJ_PADRAO[k].cor}])); }catch(e){} return JSON.parse(JSON.stringify(PJ_PADRAO)); }
function pjSalvarCen(){ try{ localStorage.setItem('candidus_cenarios',JSON.stringify(pjCen)); }catch(e){} }
const pjAddDias=(iso,n)=>{ const t=new Date(iso+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); };
// aplica um cenário à base → saldo mês a mês
function projetar(itens, saldoIni, hoje, meses, p){
  const yms=[]; { let [a,m]=[+hoje.slice(0,4),+hoje.slice(5,7)]; for(let i=0;i<meses;i++){ const [y,mm]=addMes(a,m,i); yms.push(`${y}-${String(mm).padStart(2,'0')}`); } }
  const B=Object.fromEntries(yms.map(k=>[k,{ent:0,sai:0,entVenc:0,saiVenc:0,rec:0}]));
  let foraHorizonte=0;
  itens.forEach(x=>{
    const v=Number(x.valor||0);
    if(x.tipo==='entrada'){
      let data, val;
      if(!x.data){ data=pjAddDias(hoje,p.atraso); val=v*p.recVenc/100; }
      else { data=pjAddDias(x.data,p.atraso); val=v*(1-p.inad/100); }
      const k=data.slice(0,7); if(!B[k]){ foraHorizonte+=val; return; }
      B[k].ent+=val; if(!x.data) B[k].entVenc+=val; if(x.origem==='rec_receber') B[k].rec+=val;
    } else {
      const val=v*(1+p.ajS/100), k=(x.data||hoje).slice(0,7); if(!B[k]) return;
      B[k].sai+=val; if(!x.data) B[k].saiVenc+=val;
    }
  });
  let s=saldoIni; let min={v:saldoIni,ym:yms[0]}, primeiroNeg=null;
  const linhas=yms.map(k=>{ const b=B[k], ini=s; s=ini+b.ent-b.sai;
    if(s<min.v) min={v:s,ym:k}; if(s<0&&!primeiroNeg) primeiroNeg=k;
    return {ym:k, ini, ent:b.ent, sai:b.sai, fim:s, entVenc:b.entVenc, saiVenc:b.saiVenc, rec:b.rec}; });
  return {linhas, fim:s, min, primeiroNeg, foraHorizonte};
}
async function renderProjecao(){
  pjCen=pjCarregarCen();
  $('main').innerHTML=`<div class="page-h"><h1>Fluxo de caixa projetado</h1><span class="scope">${companyId?'':'· todas as empresas'}</span><div class="spacer"></div></div>
    <div class="updated">Parte do saldo de hoje e soma o que está em aberto + as próximas ocorrências dos recorrentes. Os cenários mudam inadimplência, atraso e saídas.</div>
    <div class="filters">
      <div class="fg"><label>Horizonte</label><select id="pjMeses">${[3,6,12].map(n=>`<option value="${n}" ${pjMeses===n?'selected':''}>${n} meses</option>`).join('')}</select></div>
    </div>
    <div id="pjArea"><div class="loading">Projetando…</div></div>`;
  $('pjMeses').onchange=e=>{ pjMeses=+e.target.value; loadProjecao(); };
  await loadProjecao();
}
async function loadProjecao(){
  $('pjArea').innerHTML='<div class="loading">Projetando…</div>';
  try{
    const hoje=todayStr(); const [y,m]=[+hoje.slice(0,4),+hoje.slice(5,7)]; const [fy,fm]=addMes(y,m,pjMeses);
    const ate=pjAddDias(`${fy}-${String(fm).padStart(2,'0')}-01`,-1);
    const [base,res]=await Promise.all([ db.rpc('projecao_base',{ p_company:companyId||null, p_ate:ate }), db.rpc('resumo_financeiro',{ p_company:companyId||null }) ]);
    if(base.error) throw base.error; if(res.error) throw res.error;
    pjBase=base.data||{itens:[]};
    const R=(res.data||[]).reduce((s,x)=>{ s.saldo+=Number(x.saldo||0); s.ab+=Number(x.receber_aberto||0); s.ve+=Number(x.receber_vencido||0); return s; },{saldo:0,ab:0,ve:0});
    pjSaldo=R.saldo; pjInadAtual=R.ab?R.ve/R.ab*100:null;
    drawProjecao();
  }catch(err){ $('pjArea').innerHTML=`<div class="panel"><div class="empty">Erro: ${esc(err.message||err)}<br>Rodou o candidus_projecao.sql?</div></div>`; }
}

    <td class="r" style="color:var(--green)">${money(l.ent)}${l.entVenc?`<div class="dre-av">inclui ${money(l.entVenc)} de vencidos</div>`:''}</td>

    <td class="r ${l.fim<0?'dre-neg':''}"><b>${money(l.fim)}</b></td></tr>`).join('');
  const params=`<table class="dre-tbl"><thead><tr><th>Premissa</th>${Object.keys(pjCen).map(k=>`<th class="r" style="color:${pjCen[k].cor}">${pjCen[k].nome}</th>`).join('')}</tr></thead><tbody>
    ${PJ_PARAM.map(([key,lbl,dica])=>`<tr><td title="${esc(dica)}">${lbl} <span class="ind-i">ⓘ</span><div class="dre-av">${esc(dica)}</div></td>${Object.keys(pjCen).map(k=>`<td class="r"><input type="number" step="1" data-pjp="${k}|${key}" value="${pjCen[k][key]}" style="width:78px;text-align:right;padding:6px 8px"> ${key==='atraso'?'d':'%'}</td>`).join('')}</tr>`).join('')}
    </tbody></table>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px;flex-wrap:wrap">

  $('pjArea').innerHTML=`${alerta}<div class="cards">${cards.map(c=>`<div class="kpi"><div class="lbl">${c.lbl}</div><div class="val ${c.cls||''}">${c.val}</div>${c.sub?`<div class="meta">${c.sub}</div>`:''}</div>`).join('')}</div>
    <div class="grid2" style="margin-top:16px">

    </div>

      <h3 style="margin:0"><span class="dot t"></span>Mês a mês</h3><div class="seg" style="max-width:360px">${tab}</div></div>
      <table id="pjTab" style="margin-top:10px"><thead><tr><th>Mês</th><th class="r">Saldo inicial</th><th class="r">Entradas</th><th class="r">Saídas</th><th class="r">Saldo final</th></tr></thead><tbody>${linhas}</tbody></table>

  $('pjArea').querySelectorAll('[data-pjp]').forEach(inp=>inp.onchange=()=>{ const [k,key]=inp.dataset.pjp.split('|'); let v=Number(inp.value);
    if(!isFinite(v)) v=0; if(key==='inad'||key==='recVenc') v=Math.min(100,Math.max(0,v)); if(key==='atraso') v=Math.max(0,Math.round(v)); if(key==='ajS') v=Math.max(-100,v);
    pjCen[k][key]=v; pjSalvarCen(); drawProjecao(); });
  $('pjReset').onclick=()=>{ pjCen=JSON.parse(JSON.stringify(PJ_PADRAO)); pjSalvarCen(); drawProjecao(); };
}
// gráfico de linhas (mesma escala), aceita negativo; série "forte" fica mais grossa
function svgLinhas({labels, series, h=250}){
  const W=Math.max(520, labels.length*62), H=h, pl=74, pr=16, pt=14, pb=26;
  const all=series.flatMap(s=>s.vals.filter(v=>v!=null&&isFinite(v)));
  if(!all.length) return '<div class="empty" style="padding:28px">Sem dados.</div>';
  let max=Math.max(0,...all), min=Math.min(0,...all); if(max===min) max=min+1;
  const pad=(max-min)*0.08; max+=pad; if(min<0) min-=pad;
  const y=v=>pt+(max-v)/(max-min)*(H-pt-pb), gw=(W-pl-pr)/Math.max(1,labels.length-1), x=i=>pl+i*gw;
  let g='';
  for(let i=0;i<=4;i++){ const v=min+(max-min)*i/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" class="sc-grid"/><text x="${pl-8}" y="${y(v)+4}" class="sc-ax" text-anchor="end">${moneyCurto(v)}</text>`; }
  if(min<0) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--red)" stroke-dasharray="4 3"/>`;
  labels.forEach((lb,i)=>{ g+=`<text x="${x(i)}" y="${H-8}" class="sc-ax" text-anchor="middle">${esc(lb)}</text>`; });
  series.slice().sort((a,b)=>(a.forte?1:0)-(b.forte?1:0)).forEach(s=>{
    g+=`<path d="${s.vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ')}" fill="none" style="stroke:${s.cor};opacity:${s.forte?1:.55}" stroke-width="${s.forte?3:2}"/>`;
    s.vals.forEach((v,i)=>{ g+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${s.forte?4:3}" style="fill:${s.cor};opacity:${s.forte?1:.55}"><title>${esc(s.nome)} · ${esc(labels[i])}: ${money(v)}</title></circle>`; });
  });
  const leg=series.map(s=>`<span><span class="sc-dot sc-line" style="background:${s.cor}"></span>${esc(s.nome)}${s.forte?' (selecionado)':''}</span>`).join('');
  return `<div class="sc-leg">${leg}</div><div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="sc-svg">${g}</svg></div>`;
}

    if(e2){ $('mSave').disabled=false; toast('Erro: '+e2.message,'err'); return; }
    closeModal(); toast(`${titulo} fechado. 🔒`); loadFechamento();
  };
}
function openReabrirMes(ym){
  const m=+ym.slice(5,7), titulo=`${MESNOME[m-1]}/${ym.slice(0,4)}`;
  $('modalRoot').innerHTML=`<div class="overlay"><div class="modal sm"><div class="modal-h"><h2>Reabrir ${titulo}</h2><button class="x" id="mx">×</button></div>
    <div class="modal-b"><div class="box">Reabrir libera alterações nos números desse mês. Fica registrado no histórico quem reabriu e por quê. Só administrador ou gestor.</div>
      <div class="field"><label>Motivo *</label><textarea id="fcMot" rows="3" placeholder="Ex.: cliente enviou nota fiscal atrasada"></textarea></div></div>
    <div class="modal-f"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn" id="mSave" style="background:var(--amber)">Reabrir</button></div></div></div>`;

  $('mSave').onclick=async ()=>{

/* ===================== RELATÓRIO GERENCIAL (PDF) ===================== */
const REL_SECOES=[['resumo','Resumo executivo'],['dre','DRE do mês'],['mc','Margem de contribuição e equilíbrio'],['fluxo','Fluxo de caixa (6 meses)'],
  ['custos','Despesas por centro de custo e categoria'],['posicao','Contas a receber e a pagar'],['projecao','Projeção de caixa (3 meses)'],['obs','Observações do analista']];
let relCfg=null;
function relCfgPadrao(){
  const h=todayStr(), [a,m]=addMes(+h.slice(0,4),+h.slice(5,7),-1);
  let bpo=''; try{ bpo=localStorage.getItem('candidus_bpo_nome')||''; }catch(e){}
  return { co:companyId||'', mes:`${a}-${String(m).padStart(2,'0')}`, bpo, obs:'', secoes:Object.fromEntries(REL_SECOES.map(([k])=>[k,true])) };
}
async function renderRelatorio(preset){
  relCfg=relCfg||relCfgPadrao(); if(preset) Object.assign(relCfg,preset);
  if(companyId) relCfg.co=companyId;
  $('main').innerHTML=`<div class="page-h"><h1>Relatório gerencial</h1><div class="spacer"></div>
    <button class="btn" id="relPrint">Imprimir / Salvar PDF</button></div>
    <div class="updated">Monte o relatório do mês pro cliente. Na janela de impressão, escolha <b>“Salvar como PDF”</b>.</div>
    <div class="rel-wrap">
      <div class="panel rel-cfg">
        <div class="field"><label>Empresa</label><select id="relCo" ${companyId?'disabled':''}><option value="">Consolidado (todas)</option>${companies.map(c=>`<option value="${c.id}" ${c.id===relCfg.co?'selected':''}>${esc(c.nome_fantasia||c.razao_social)}</option>`).join('')}</select></div>
        <div class="field"><label>Mês</label><input type="month" id="relMes" value="${relCfg.mes}"></div>
        <div class="field"><label>Elaborado por (seu BPO)</label><input id="relBpo" value="${esc(relCfg.bpo)}" placeholder="Ex.: Candidus BPO Financeiro"></div>
        <div class="field"><label>Seções</label>${REL_SECOES.map(([k,n])=>`<label class="rel-chk"><input type="checkbox" data-relsec="${k}" ${relCfg.secoes[k]?'checked':''}> ${n}</label>`).join('')}</div>
        <div class="field"><label>Observações do analista</label><textarea id="relObs" rows="7" placeholder="Ex.: Receita caiu 12% por sazonalidade; despesas com frota acima do orçado; recomendamos renegociar o aluguel…">${esc(relCfg.obs)}</textarea></div>
        <button class="btn ghost" id="relAtualizar" style="width:100%">Atualizar prévia</button>
      </div>
      <div class="rel-prev"><div id="relStatus" class="loading">Montando relatório…</div><iframe id="relFrame" title="Prévia do relatório"></iframe></div>
    </div>`;
  const ler=()=>{ relCfg.co=$('relCo').value; relCfg.mes=$('relMes').value||relCfg.mes; relCfg.bpo=$('relBpo').value.trim(); relCfg.obs=$('relObs').value;
    d0().querySelectorAll('[data-relsec]').forEach(c=>relCfg.secoes[c.dataset.relsec]=c.checked); try{ localStorage.setItem('candidus_bpo_nome',relCfg.bpo); }catch(e){} };
  const d0=()=>document;
  ['relCo','relMes'].forEach(id=>$(id).onchange=()=>{ ler(); gerarPrevia(); });
  d0().querySelectorAll('[data-relsec]').forEach(c=>c.onchange=()=>{ ler(); gerarPrevia(true); });
  $('relAtualizar').onclick=()=>{ ler(); gerarPrevia(true); };
  $('relPrint').onclick=()=>{ ler(); gerarPrevia(true).then(()=>{ const f=$('relFrame'); if(f&&f.contentWindow){ f.contentWindow.focus(); f.contentWindow.print(); } }); };
  await gerarPrevia();
}
let relDadosCache=null;
async function gerarPrevia(soReMontar){
  try{
    $('relStatus').style.display=''; $('relStatus').textContent='Montando relatório…';
    const chave=relCfg.co+'|'+relCfg.mes;
    if(!soReMontar || !relDadosCache || relDadosCache.chave!==chave){ relDadosCache=await relDados(relCfg); relDadosCache.chave=chave; }
    const html=montarRelatorioHtml(relCfg, relDadosCache);
    const f=$('relFrame'); if(f) f.srcdoc=html;
    $('relStatus').style.display='none';
    return html;
  }catch(err){ $('relStatus').style.display=''; $('relStatus').innerHTML=`Erro: ${esc(err.message||err)}`; }
}
// busca tudo que o relatório precisa (somas no banco)
async function relDados(cfg){
  const ano=+cfg.mes.slice(0,4), m=+cfg.mes.slice(5,7), co=cfg.co||null;
  const [pa,pm]=addMes(ano,m,-1), [ia,im]=addMes(ano,m,-11);
  await loadDreBase();
  const hoje=todayStr(), [fa,fm2]=addMes(+hoje.slice(0,4),+hoje.slice(5,7),3);
  const projAte=pjAddDias(`${fa}-${String(fm2).padStart(2,'0')}-01`,-1);
  const [realiz,flux,accs,ccs,res,fech,proj]=await Promise.all([
    dreRealizado(co, mesIni(Math.min(ia,ano),Math.min(ia,ano)===ano?1:im), mesIni(ano,m)),
    db.rpc('fluxo_mensal',{ p_company:co }),
    co?db.from('financial_accounts').select('saldo_inicial').eq('company_id',co):db.from('financial_accounts').select('saldo_inicial'),
    db.rpc('custos_por_cc',{ p_company:co, p_ini:mesIni(ano,m), p_fim:mesIni(ano,m) }),
    db.rpc('resumo_financeiro',{ p_company:co }),
    co?db.from('periodos_fechados').select('fechado_em,profiles(nome,email)').eq('company_id',co).eq('competencia',mesIni(ano,m)):Promise.resolve({data:[]}),
    db.rpc('projecao_base',{ p_company:co, p_ate:projAte }),
  ]);
  for(const r of [flux,accs,ccs,res,proj]) if(r.error) throw r.error;
  return { ano, m, pa, pm, realiz, fluxo:flux.data||[], base:(accs.data||[]).reduce((s,x)=>s+Number(x.saldo_inicial||0),0),
    ccs:(ccs.data||[]).map(d=>({...d,valor:Number(d.valor)})), res:res.data||[], fech:(fech.data||[])[0]||null, proj:proj.data||{itens:[]}, hoje };
}
// monta o HTML A4 (função pura: dados → html)
function montarRelatorioHtml(cfg, D){
  const {ano,m,pa,pm}=D, S=cfg.secoes;
  const empresa=cfg.co?coName(cfg.co):'Consolidado — todas as empresas';
  const per=`${MESNOME[m-1]}/${ano}`;
  const pct=(v,s)=>v==null||!isFinite(v)?'—':((s&&v>0)?'+':'')+v.toFixed(1).replace('.',',')+'%';
  const idx=c=>dreItems.findIndex(i=>i.codigo===c);
  const cur=dreAgg(D.realiz,mesIni(ano,m),mesIni(ano,m)), prv=dreAgg(D.realiz,mesIni(pa,pm),mesIni(pa,pm)), acu=dreAgg(D.realiz,mesIni(ano,1),mesIni(ano,m));
  const vC=dreLinhas(cur), vP=dreLinhas(prv), vA=dreLinhas(acu);
  const at=(v,c)=>{ const i=idx(c); return i>=0?v[i]:0; };
  const RL=at(vC,'receita_liquida'), LL=at(vC,'resultado_liquido'), RLp=at(vP,'receita_liquida'), LLp=at(vP,'resultado_liquido');
  const ah=(a,b)=>b?(a-b)/Math.abs(b)*100:null;
  // caixa
  const F=D.fluxo; const real=ym=>F.find(x=>x.ym===ym)||{real_e:0,real_s:0};
  const saldoAte=ym=>D.base+F.filter(x=>x.ym<=ym).reduce((s,x)=>s+Number(x.real_e)-Number(x.real_s),0);
  const ym0=`${ano}-${String(m).padStart(2,'0')}`, ymP=`${pa}-${String(pm).padStart(2,'0')}`;
  const ent=Number(real(ym0).real_e), sai=Number(real(ym0).real_s), saldoFim=saldoAte(ym0), saldoFimP=saldoAte(ymP);
  const blocos=[];
  // cabeçalho
  const fechTxt=D.fech?`🔒 Período fechado em ${new Date(D.fech.fechado_em).toLocaleDateString('pt-BR')}${D.fech.profiles?' por '+esc(D.fech.profiles.nome||D.fech.profiles.email):''} — números definitivos.`
    :(cfg.co?'⚠️ Período ainda em aberto — os números podem mudar até o fechamento.':'Visão consolidada de todas as empresas.');
  blocos.push(`<header class="cab"><div><div class="sub">Relatório gerencial</div><h1>${esc(empresa)}</h1><div class="per">${per}</div></div>
    <div class="cab-d">${cfg.bpo?`<div class="bpo">${esc(cfg.bpo)}</div>`:''}<div>Emitido em ${new Date().toLocaleDateString('pt-BR')}</div></div></header>
    <div class="selo ${D.fech?'ok':'aberto'}">${fechTxt}</div>`);
  if(S.resumo){
    const card=(l,v,var_,cls)=>`<div class="kp"><div class="kl">${l}</div><div class="kv ${cls||''}">${v}</div>${var_!=null?`<div class="kvar ${var_<0?'neg':'pos'}">${pct(var_,true)} vs ${MESCURTO[pm-1]}</div>`:''}</div>`;
    blocos.push(`<section><h2>Resumo executivo</h2><div class="kps">
      ${card('Receita líquida',money(RL),ah(RL,RLp))}
      ${card('Lucro líquido',money(LL),ah(LL,LLp),LL<0?'neg':'')}
      ${card('Margem líquida',pct(RL?LL/RL*100:null),null,LL<0?'neg':'')}
      ${card('Saldo de caixa no fim do mês',money(saldoFim),ah(saldoFim,saldoFimP),saldoFim<0?'neg':'')}
      ${card('Entradas no mês (caixa)',money(ent),null)}
      ${card('Saídas no mês (caixa)',money(sai),null)}
    </div></section>`);
  }
  if(S.obs && cfg.obs && cfg.obs.trim()){
    blocos.push(`<section class="nb"><h2>Comentários do analista</h2><div class="obs">${esc(cfg.obs.trim()).replace(/\n/g,'<br>')}</div></section>`);
  }
  if(S.dre){
    const bAV=v=>dreBaseAV(v);
    const linhas=dreItems.map((it,i)=>{ const sub=it.tipo==='subtotal'; const b=bAV(vC);
      return `<tr class="${sub?'sub':''}"><td>${esc(it.titulo)}</td><td class="r ${vC[i]<0?'neg':''}">${money(vC[i])}</td><td class="r av">${b?pct(vC[i]/Math.abs(b)*100):'—'}</td>
        <td class="r">${money(vP[i])}</td><td class="r av ${ah(vC[i],vP[i])<0?'neg':''}">${pct(ah(vC[i],vP[i]),true)}</td><td class="r">${money(vA[i])}</td></tr>`; }).join('');
    blocos.push(`<section><h2>DRE gerencial</h2><table><thead><tr><th>Descrição</th><th class="r">${MESCURTO[m-1]}/${ano}</th><th class="r">AV%</th><th class="r">${MESCURTO[pm-1]}/${pa}</th><th class="r">AH%</th><th class="r">Acumulado ${ano}</th></tr></thead><tbody>${linhas}</tbody></table>
      <div class="nota">Regime de competência. AV% sobre a receita líquida; AH% contra o mês anterior.</div></section>`);
  }
  if(S.mc){
    const CV=indCV(D.realiz,mesIni(ano,m),mesIni(ano,m)), mc=RL-CV.variavel, mcp=RL?mc/RL:null, pe=(mcp&&mcp>0)?CV.fixo/mcp:null;
    blocos.push(`<section class="nb"><h2>Margem de contribuição e ponto de equilíbrio</h2><table><tbody>
      <tr class="sub"><td>Receita líquida</td><td class="r">${money(RL)}</td><td class="r av">100%</td></tr>
      <tr><td>(−) Custos e despesas variáveis</td><td class="r">${money(CV.variavel)}</td><td class="r av">${RL?pct(CV.variavel/RL*100):'—'}</td></tr>
      <tr class="sub"><td>(=) Margem de contribuição</td><td class="r ${mc<0?'neg':''}">${money(mc)}</td><td class="r av">${mcp!=null?pct(mcp*100):'—'}</td></tr>
      <tr><td>(−) Custos e despesas fixos</td><td class="r">${money(CV.fixo)}</td><td class="r av">${RL?pct(CV.fixo/RL*100):'—'}</td></tr>
      <tr class="sub"><td>(=) Resultado operacional</td><td class="r ${mc-CV.fixo<0?'neg':''}">${money(mc-CV.fixo)}</td><td class="r av">${RL?pct((mc-CV.fixo)/RL*100):'—'}</td></tr>
      </tbody></table>
      <div class="destaque">${pe!=null?`Ponto de equilíbrio: <b>${money(pe)}</b> de receita líquida por mês · Margem de segurança: <b>${pct((RL-pe)/(RL||1)*100)}</b> ${RL>=pe?'(acima do equilíbrio)':'(abaixo do equilíbrio)'}`:'Sem margem de contribuição positiva no mês — não há ponto de equilíbrio.'}${CV.semClass?'<br><span class="nota">Estimado: parte das categorias ainda não foi classificada como fixa/variável.</span>':''}</div></section>`);
  }
  if(S.fluxo){
    const yms=[5,4,3,2,1,0].map(n=>{ const [a,mm]=addMes(ano,m,-n); return `${a}-${String(mm).padStart(2,'0')}`; });
    const rows=yms.map(ym=>({ym, e:Number(real(ym).real_e), s:Number(real(ym).real_s), fim:saldoAte(ym)}));
    const graf=svgChart({ labels:yms.map(ymLabel), series:[{nome:'Entradas',cor:'#16a34a',vals:rows.map(r=>r.e)},{nome:'Saídas',cor:'#dc2626',vals:rows.map(r=>r.s)}],
      line:{nome:'Saldo no fim do mês',cor:'#0e9384',vals:rows.map(r=>r.fim),fmt:v=>moneyCurto(v)}, h:220 });
    blocos.push(`<section class="nb"><h2>Fluxo de caixa realizado — últimos 6 meses</h2>${graf}
      <table><thead><tr><th>Mês</th><th class="r">Entradas</th><th class="r">Saídas</th><th class="r">Resultado</th><th class="r">Saldo final</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${ymLabel(r.ym)}</td><td class="r">${money(r.e)}</td><td class="r">${money(r.s)}</td><td class="r ${r.e-r.s<0?'neg':''}">${money(r.e-r.s)}</td><td class="r ${r.fim<0?'neg':''}"><b>${money(r.fim)}</b></td></tr>`).join('')}
      </tbody></table></section>`);
  }
  if(S.custos){
    const desp=D.ccs.filter(d=>d.origem==='pagar'), tot=desp.reduce((s,d)=>s+d.valor,0);
    const porCC={}; desp.forEach(d=>{ const k=d.centro_custo; porCC[k]=(porCC[k]||0)+d.valor; });
    const lcc=Object.entries(porCC).sort((a,b)=>b[1]-a[1]);
    const grupos=custosAgrupar(desp).slice(0,10);
    blocos.push(`<section class="nb"><h2>Despesas do mês</h2>${tot?`<div class="duas">
      <div><h3>Por centro de custo</h3><table><tbody>${lcc.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="r">${money(v)}</td><td class="r av">${pct(v/tot*100)}</td></tr>`).join('')}
        <tr class="sub"><td>Total</td><td class="r">${money(tot)}</td><td class="r av">100%</td></tr></tbody></table></div>
      <div><h3>Principais grupos de categoria</h3><table><tbody>${grupos.map(g=>`<tr><td>${esc(g.nome)}</td><td class="r">${money(g.total)}</td><td class="r av">${pct(g.total/tot*100)}</td></tr>`).join('')}</tbody></table></div>
    </div>`:'<div class="nota">Nenhuma despesa lançada no mês.</div>'}</section>`);
  }
  if(S.posicao){
    const R=D.res.reduce((s,x)=>{ ['receber_aberto','receber_vencido','pagar_aberto','pagar_vencido','receber_30d','pagar_30d'].forEach(k=>s[k]+=Number(x[k]||0)); return s; },{receber_aberto:0,receber_vencido:0,pagar_aberto:0,pagar_vencido:0,receber_30d:0,pagar_30d:0});
    blocos.push(`<section class="nb"><h2>Contas a receber e a pagar <span class="h2s">posição em ${new Date(D.hoje+'T12:00:00').toLocaleDateString('pt-BR')}</span></h2><table>
      <thead><tr><th></th><th class="r">Em aberto</th><th class="r">Vencido</th><th class="r">Próximos 30 dias</th></tr></thead><tbody>
      <tr><td>A receber</td><td class="r">${money(R.receber_aberto)}</td><td class="r ${R.receber_vencido?'neg':''}">${money(R.receber_vencido)}</td><td class="r">${money(R.receber_30d)}</td></tr>
      <tr><td>A pagar</td><td class="r">${money(R.pagar_aberto)}</td><td class="r ${R.pagar_vencido?'neg':''}">${money(R.pagar_vencido)}</td><td class="r">${money(R.pagar_30d)}</td></tr>
      <tr class="sub"><td>Saldo (receber − pagar)</td><td class="r ${R.receber_aberto-R.pagar_aberto<0?'neg':''}">${money(R.receber_aberto-R.pagar_aberto)}</td><td></td><td class="r ${R.receber_30d-R.pagar_30d<0?'neg':''}">${money(R.receber_30d-R.pagar_30d)}</td></tr>
      </tbody></table>${R.receber_aberto?`<div class="nota">Inadimplência atual: ${pct(R.receber_vencido/R.receber_aberto*100)} do total a receber está vencido.</div>`:''}</section>`);
  }
  if(S.projecao){
    const saldoHoje=D.res.reduce((s,x)=>s+Number(x.saldo||0),0), cen=pjCarregarCen().realista;
    const P=projetar(D.proj.itens||[],saldoHoje,D.hoje,3,cen);
    blocos.push(`<section class="nb"><h2>Projeção de caixa — próximos 3 meses <span class="h2s">cenário realista, a partir de hoje</span></h2><table>
      <thead><tr><th>Mês</th><th class="r">Saldo inicial</th><th class="r">Entradas previstas</th><th class="r">Saídas previstas</th><th class="r">Saldo final</th></tr></thead><tbody>
      ${P.linhas.map(l=>`<tr><td>${ymLabel(l.ym)}</td><td class="r">${money(l.ini)}</td><td class="r">${money(l.ent)}</td><td class="r">${money(l.sai)}</td><td class="r ${l.fim<0?'neg':''}"><b>${money(l.fim)}</b></td></tr>`).join('')}
      </tbody></table><div class="nota">Premissas: inadimplência ${cen.inad}%, atraso médio ${cen.atraso} dias, ${cen.recVenc}% dos vencidos recebidos${cen.ajS?`, saídas ${cen.ajS>0?'+':''}${cen.ajS}%`:''}. Considera contas em aberto e recorrências programadas.${P.primeiroNeg?` <b class="neg">Atenção: saldo negativo previsto em ${ymLabel(P.primeiroNeg)}.</b>`:''}</div></section>`);
  }
  blocos.push(`<footer>${cfg.bpo?esc(cfg.bpo)+' · ':''}Relatório gerado pelo Candidus Gestão Financeira · ${esc(empresa)} · ${per}</footer>`);
  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Relatório gerencial — ${esc(empresa)} — ${per}</title><style>${REL_CSS}</style></head><body>${blocos.join('\n')}</body></html>`;
}
