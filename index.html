<style>
:root{
  --ink:#0F1E2E; --ink-2:#16293b; --line:#e6ebf0; --surface:#f5f8fa;
  --card:#ffffff; --text:#1a2530; --muted:#64748b;
  --teal:#0e9384; --teal-d:#0b7a6e; --teal-soft:#e6f5f2;
  --green:#16a34a; --red:#dc2626; --amber:#d97706;
  --radius:14px; --shadow:0 1px 2px rgba(16,30,46,.06),0 8px 24px rgba(16,30,46,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--surface);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 20% -10%,#123049 0,transparent 55%),
             radial-gradient(1000px 500px at 110% 120%,#0d5b52 0,transparent 50%),var(--ink)}
.login-card{width:100%;max-width:400px;background:var(--card);border-radius:20px;padding:38px 32px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:4px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#0b6b73);
  display:grid;place-items:center;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:19px}
.brand .name{font-family:'Space Grotesk';font-weight:700;font-size:20px;color:var(--ink);letter-spacing:-.02em}
.login-card p.sub{color:var(--muted);font-size:13.5px;margin:14px 0 26px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin:0 0 6px}
.field{margin-bottom:16px}
input[type=email],input[type=password]{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;transition:border-color .15s,box-shadow .15s}
input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.btn{width:100%;padding:12px;border-radius:10px;background:var(--teal);color:#fff;font-weight:600;font-size:14.5px;transition:background .15s}
.btn:hover{background:var(--teal-d)}
.btn:disabled{opacity:.6;cursor:default}
.msg{font-size:13px;padding:11px 13px;border-radius:9px;margin-bottom:16px;line-height:1.45}
.msg.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.msg.info{background:var(--teal-soft);color:var(--teal-d);border:1px solid #bfe8e1}

/* ---------- APP SHELL ---------- */
#app{min-height:100vh;display:grid;grid-template-columns:248px 1fr;grid-template-rows:60px 1fr}
#app.collapsed{grid-template-columns:66px 1fr}
.topbar{grid-column:1/3;background:var(--ink);display:flex;align-items:center;gap:16px;padding:0 18px;color:#fff}
.topbar .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--teal),#0b6b73);display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:16px}
.topbar .name{font-family:'Space Grotesk';font-weight:700;font-size:17px;letter-spacing:-.02em}
#app.collapsed .topbar .name{display:none}
.burger{color:#cdd8e3;font-size:20px;padding:4px 8px;border-radius:8px}
.burger:hover{background:var(--ink-2)}
.company-pick{margin-left:6px;display:flex;align-items:center;gap:8px;background:var(--ink-2);border:1px solid #24405a;border-radius:10px;padding:6px 10px}
.company-pick svg{color:var(--teal)}
.company-pick select{background:transparent;border:none;color:#fff;font-size:13.5px;font-weight:500;max-width:230px}
.company-pick select:focus{outline:none}
.company-pick option{color:#111}
.spacer{flex:1}
.user{display:flex;align-items:center;gap:10px}
.user .email{font-size:13px;color:#cdd8e3;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user .out{color:#fff;font-size:12.5px;font-weight:600;border:1px solid #2c4a66;padding:6px 11px;border-radius:9px}
.user .out:hover{background:var(--ink-2)}

.side{background:#fff;border-right:1px solid var(--line);padding:14px 10px;overflow-y:auto}
.nav-group{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:#94a3b8;text-transform:uppercase;padding:14px 12px 6px}
#app.collapsed .nav-group{text-align:center;font-size:9px;padding:12px 0 4px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;font-size:14px;font-weight:500;color:#334155;position:relative}
.nav-item .ico{width:18px;text-align:center;flex:none}
.nav-item.active{background:var(--teal-soft);color:var(--teal-d);font-weight:600}
.nav-item.soon{color:#aeb8c4;cursor:not-allowed}
.nav-item.soon .tag{margin-left:auto;font-size:9px;background:#f1f5f9;color:#94a3b8;padding:2px 6px;border-radius:20px;font-weight:600}
.nav-item.link:hover:not(.active){background:#f3f6f9}
#app.collapsed .nav-item .label,#app.collapsed .nav-item .tag{display:none}
#app.collapsed .nav-item{justify-content:center;padding:10px 0}

.main{padding:26px 30px;overflow-y:auto}
.page-h{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.page-h h1{font-family:'Space Grotesk';font-size:23px;letter-spacing:-.02em;color:var(--ink)}
.page-h .scope{font-size:12.5px;color:var(--muted)}
.updated{font-size:12px;color:var(--muted);margin-bottom:22px}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:'Space Grotesk';font-size:22px;font-weight:700;margin-top:9px;letter-spacing:-.02em;color:var(--ink)}
.kpi .val.pos{color:var(--green)} .kpi .val.neg{color:var(--red)} .kpi .val.warn{color:var(--amber)}
.dot{width:8px;height:8px;border-radius:50%} .dot.g{background:var(--green)} .dot.r{background:var(--red)} .dot.a{background:var(--amber)} .dot.t{background:var(--teal)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel h3{font-size:14px;font-weight:600;color:var(--ink);padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#94a3b8;font-weight:600;padding:10px 18px;background:#fafbfc}
td{padding:11px 18px;border-top:1px solid #f1f4f7;color:#334155}
td.r,th.r{text-align:right}
tr:hover td{background:#fafcfd}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-block}
.pill.receber{background:#e7f6ec;color:#15803d}
.pill.pagar{background:#fdecec;color:#b91c1c}
.pill.venc{background:#fef2f2;color:#dc2626}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:13px}
.loading{padding:40px;text-align:center;color:var(--muted);font-size:14px}

@media(max-width:860px){
  #app,#app.collapsed{grid-template-columns:1fr}
  .side{display:none}
  .cards{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .company-pick select{max-width:130px}
  .user .email{display:none}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="login-card">
    <div class="brand"><div class="mark">C</div><div class="name">Candidus</div></div>
    <p class="sub">Gestão Financeira · BPO · Controladoria</p>
    <div id="loginMsg"></div>
    <form id="loginForm">
      <div class="field"><label>E-mail</label>
        <input type="email" id="email" placeholder="voce@empresa.com" required></div>
      <div class="field"><label>Senha</label>
        <input type="password" id="password" placeholder="••••••••" required></div>
      <button class="btn" type="submit" id="loginBtn">Entrar</button>
    </form>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <div class="topbar">
    <button class="burger" id="burger" title="Recolher menu">☰</button>
    <div class="mark">C</div><div class="name">Candidus</div>
    <div class="company-pick">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1m4 0h1M9 13h1m4 0h1M9 17h1m4 0h1"/></svg>
      <select id="companySel"></select>
    </div>
    <div class="spacer"></div>
    <div class="user"><span class="email" id="userEmail"></span>
      <button class="out" id="logout">Sair</button></div>
  </div>

  <nav class="side" id="side"></nav>

  <main class="main">
    <div class="page-h"><h1>Dashboard</h1><span class="scope" id="scope"></span></div>
    <div class="updated" id="updated"></div>
    <div id="dashArea"><div class="loading">Carregando dados…</div></div>
  </main>
</div>

<script>
/* ===================== SETUP ===================== */
const configured = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20;
let db = null;
if (configured) db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const money = v => BRL.format(Number(v||0));
const $ = id => document.getElementById(id);
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => d ? d.split('-').reverse().join('/') : '—';
const daysBetween = d => Math.floor((new Date(today()) - new Date(d)) / 86400000);

/* ===================== MENU (estrutura da Fase 1) ===================== */
const MENU = [
  {g:'Principal', items:[
    {ico:'▚', label:'Dashboard', active:true},
  ]},
  {g:'Financeiro', items:[
    {ico:'↘', label:'Contas a receber', soon:true},
    {ico:'↗', label:'Contas a pagar', soon:true},
    {ico:'≋', label:'Fluxo de caixa', soon:true},
  ]},
  {g:'Cadastros', items:[
    {ico:'◎', label:'Clientes', soon:true},
    {ico:'◍', label:'Fornecedores', soon:true},
    {ico:'⌗', label:'Categorias', soon:true},
    {ico:'⊞', label:'Centros de custo', soon:true},
    {ico:'▤', label:'Contas financeiras', soon:true},
    {ico:'▦', label:'Empresas', soon:true},
  ]},
  {g:'Gestão', items:[
    {ico:'◆', label:'Controladoria', soon:true},
    {ico:'◈', label:'BPO', soon:true},
  ]},
];
function renderMenu(){
  $('side').innerHTML = MENU.map(grp =>
    `<div class="nav-group">${grp.g}</div>` +
    grp.items.map(it => `
      <div class="nav-item ${it.active?'active':''} ${it.soon?'soon':'link'}">
        <span class="ico">${it.ico}</span><span class="label">${it.label}</span>
        ${it.soon?'<span class="tag">em breve</span>':''}
      </div>`).join('')
  ).join('');
}

/* ===================== AUTH ===================== */
function showLoginMsg(text, type='err'){ $('loginMsg').innerHTML = `<div class="msg ${type}">${text}</div>`; }

async function boot(){
  if(!configured){
    showLoginMsg('⚙️ Configuração pendente: cole a <b>Project URL</b> e a <b>anon key</b> do Supabase no topo do arquivo index.html.', 'info');
    $('loginForm').classList.add('hidden');
    return;
  }
  const { data:{ session } } = await db.auth.getSession();
  if(session) enterApp(session); 
}
$('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  $('loginBtn').disabled = true; $('loginBtn').textContent = 'Entrando…';
  const { data, error } = await db.auth.signInWithPassword({ email:$('email').value.trim(), password:$('password').value });
  $('loginBtn').disabled = false; $('loginBtn').textContent = 'Entrar';
  if(error){ showLoginMsg('Não foi possível entrar: e-mail ou senha inválidos.'); return; }
  enterApp(data.session);
});
$('logout').addEventListener('click', async ()=>{ await db.auth.signOut(); location.reload(); });

async function enterApp(session){
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('userEmail').textContent = session.user.email;
  renderMenu();
  await loadCompanies();
  await loadDashboard();
}

/* ===================== EMPRESAS ===================== */
let companyId = null; // null = todas
async function loadCompanies(){
  const { data, error } = await db.from('companies').select('id,razao_social,nome_fantasia').order('razao_social');
  const sel = $('companySel');
  if(error){ sel.innerHTML = '<option>Erro ao carregar</option>'; return; }
  sel.innerHTML = '<option value="">Todas as empresas</option>' +
    (data||[]).map(c=>`<option value="${c.id}">${c.nome_fantasia||c.razao_social}</option>`).join('');
  sel.onchange = ()=>{ companyId = sel.value || null; loadDashboard(); };
}

/* ===================== DASHBOARD ===================== */
function applyScope(q){ return companyId ? q.eq('company_id', companyId) : q; }

async function loadDashboard(){
  $('dashArea').innerHTML = '<div class="loading">Carregando dados…</div>';
  $('scope').textContent = companyId ? '' : '· consolidado (todas as empresas)';
  $('updated').textContent = 'Atualizado agora · ' + new Date().toLocaleString('pt-BR');

  try{
    const [acc, tx, rec, pag] = await Promise.all([
      applyScope(db.from('financial_accounts').select('saldo_inicial,company_id')),
      applyScope(db.from('bank_transactions').select('tipo,valor,company_id')),
      applyScope(db.from('vw_contas_receber').select('saldo,situacao,vencimento,descricao,company_id')),
      applyScope(db.from('vw_contas_pagar').select('saldo,situacao,vencimento,descricao,company_id')),
    ]);
    for(const r of [acc,tx,rec,pag]) if(r.error) throw r.error;

    const A = acc.data||[], T = tx.data||[], R = rec.data||[], P = pag.data||[];
    const sum = (arr,f)=>arr.reduce((s,x)=>s+Number(f(x)||0),0);

    const saldoInicial = sum(A, x=>x.saldo_inicial);
    const entradas = sum(T.filter(t=>t.tipo==='entrada'), x=>x.valor);
    const saidas   = sum(T.filter(t=>t.tipo==='saida'),   x=>x.valor);
    const saldoAtual = saldoInicial + entradas - saidas;

    const aberto = s => !['recebido','pago','cancelado'].includes(s);
    const aReceber = sum(R.filter(r=>aberto(r.situacao)), x=>x.saldo);
    const aPagar   = sum(P.filter(p=>aberto(p.situacao)), x=>x.saldo);
    const vencR = sum(R.filter(r=>r.situacao==='vencido'), x=>x.saldo);
    const vencP = sum(P.filter(p=>p.situacao==='vencido'), x=>x.saldo);
    const lim = new Date(Date.now()+30*86400000).toISOString().slice(0,10);
    const recebPrev = sum(R.filter(r=>r.situacao==='a_vencer' && r.vencimento<=lim), x=>x.saldo);
    const pagPrev   = sum(P.filter(p=>p.situacao==='a_vencer' && p.vencimento<=lim), x=>x.saldo);

    const cards = [
      {lbl:'Saldo atual', dot:'t', val:money(saldoAtual), cls:saldoAtual<0?'neg':''},
      {lbl:'Contas a receber', dot:'g', val:money(aReceber)},
      {lbl:'Contas a pagar', dot:'r', val:money(aPagar)},
      {lbl:'Resultado (rec − pag)', dot:'t', val:money(aReceber-aPagar), cls:(aReceber-aPagar)<0?'neg':'pos'},
      {lbl:'Recebimentos previstos (30d)', dot:'g', val:money(recebPrev)},
      {lbl:'Pagamentos previstos (30d)', dot:'a', val:money(pagPrev)},
      {lbl:'Vencido a receber', dot:'r', val:money(vencR), cls:vencR>0?'warn':''},
      {lbl:'Vencido a pagar', dot:'r', val:money(vencP), cls:vencP>0?'neg':''},
    ];

    // próximos vencimentos
    const prox = [
      ...R.filter(r=>r.situacao==='a_vencer').map(r=>({tipo:'receber',...r})),
      ...P.filter(p=>p.situacao==='a_vencer').map(p=>({tipo:'pagar',...p})),
    ].sort((a,b)=>a.vencimento.localeCompare(b.vencimento)).slice(0,8);

    // vencidas
    const venc = [
      ...R.filter(r=>r.situacao==='vencido').map(r=>({tipo:'receber',...r})),
      ...P.filter(p=>p.situacao==='vencido').map(p=>({tipo:'pagar',...p})),
    ].sort((a,b)=>daysBetween(b.vencimento)-daysBetween(a.vencimento)).slice(0,8);

    $('dashArea').innerHTML = `
      <div class="cards">${cards.map(c=>`
        <div class="kpi"><div class="lbl"><span class="dot ${c.dot}"></span>${c.lbl}</div>
          <div class="val ${c.cls||''}">${c.val}</div></div>`).join('')}
      </div>
      <div class="grid2">
        <div class="panel">
          <h3><span class="dot t"></span>Próximos vencimentos</h3>
          <table><thead><tr><th>Descrição</th><th>Tipo</th><th>Vencimento</th><th class="r">Valor</th></tr></thead>
          <tbody>${prox.length? prox.map(x=>`
            <tr><td>${x.descricao}</td>
              <td><span class="pill ${x.tipo}">${x.tipo==='receber'?'A receber':'A pagar'}</span></td>
              <td>${fmtDate(x.vencimento)}</td><td class="r">${money(x.saldo)}</td></tr>`).join('')
            : '<tr><td colspan="4"><div class="empty">Nada a vencer no momento.</div></td></tr>'}
          </tbody></table>
        </div>
        <div class="panel">
          <h3><span class="dot r"></span>Contas vencidas</h3>
          <table><thead><tr><th>Descrição</th><th>Tipo</th><th>Atraso</th><th class="r">Valor</th></tr></thead>
          <tbody>${venc.length? venc.map(x=>`
            <tr><td>${x.descricao}</td>
              <td><span class="pill ${x.tipo}">${x.tipo==='receber'?'A receber':'A pagar'}</span></td>
              <td>${daysBetween(x.vencimento)} dias</td><td class="r">${money(x.saldo)}</td></tr>`).join('')
            : '<tr><td colspan="4"><div class="empty">Nenhuma conta vencida. 👏</div></td></tr>'}
          </tbody></table>
        </div>
      </div>`;
  }catch(err){
    $('dashArea').innerHTML = `<div class="panel"><div class="empty">
      Não foi possível carregar os dados.<br><small>${(err.message||err)}</small><br><br>
      Dica: confirme que seu usuário está como <b>administrador</b> (veja o passo do SQL).
    </div></div>`;
  }
}

/* menu recolher */
$('burger').addEventListener('click', ()=> $('app').classList.toggle('collapsed'));

boot();
</script>
</body>
</html>
