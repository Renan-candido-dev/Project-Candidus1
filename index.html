/* ===================== CONTROLADORIA — DRE ===================== */
const MESNOME=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let dreItems=[], dreCatNat={}, dreMesSel=todayStr().slice(0,7);

async function renderDre(){
  $('main').innerHTML=`<div class="page-h"><h1>DRE Gerencial</h1><span class="scope">${companyId?'':'· consolidada (todas as empresas)'}</span><div class="spacer"></div>
    <div class="hbtns"><button class="btn ghost" id="btnMap">Mapear categorias</button></div></div>
    <div class="updated">Por competência. Compara com o mês anterior e mostra o acumulado do ano.</div>
    <div class="filters"><div class="fg dre-mes"><label>Mês (competência)</label><input type="month" id="dreMes" value="${dreMesSel}"></div></div>
    <div id="dreArea"><div class="loading">Carregando…</div></div>`;
  $('btnMap').onclick=openDreMap;
  $('dreMes').onchange=e=>{ dreMesSel=e.target.value||dreMesSel; refreshDre(); };
  await refreshDre();
}

async function loadDreBase(){
  const [items,maps]=await Promise.all([
    db.from('dre_structure_items').select('*').is('company_id',null).order('ordem'),
    db.from('dre_category_mappings').select('categoria_id,dre_item_id'),
  ]);
  dreItems=items.data||[];
  const nat={}; dreItems.forEach(i=>{ if(i.tipo==='linha') nat[i.id]=i.natureza; });
  dreCatNat={}; (maps.data||[]).forEach(m=>{ if(nat[m.dre_item_id]) dreCatNat[m.categoria_id]=nat[m.dre_item_id]; });
}

async function refreshDre(){
  $('dreArea').innerHTML='<div class="loading">Calculando…</div>';
  try{
    await loadDreBase();
    if(!Object.keys(dreCatNat).length){
      $('dreArea').innerHTML='<div class="panel"><div class="empty">Nenhuma categoria mapeada ainda.<br>Clique em <b>“Mapear categorias”</b> para dizer em que linha da DRE cada categoria entra.</div></div>';
      return;
    }
    const ano=+dreMesSel.slice(0,4), mIdx=+dreMesSel.slice(5,7)-1;
    const ini=ano+'-01-01', fim=ano+'-12-31';
    const [rec,pag]=await Promise.all([
      scopeQ(db.from('receivable_installments').select('valor,competencia,status,company_id, receivables(categoria_id)')).gte('competencia',ini).lte('competencia',fim),
      scopeQ(db.from('payable_installments').select('valor,competencia,status,company_id, payables(categoria_id)')).gte('competencia',ini).lte('competencia',fim),
    ]);
    if(rec.error) throw rec.error; if(pag.error) throw pag.error;

    // soma por natureza por mês (0-11)
    const lineSums={}; let semMap=0;
    const push=(cat,comp,valor)=>{ const n=dreCatNat[cat]; if(!n){ semMap++; return; } const mi=+comp.slice(5,7)-1;
      (lineSums[n]=lineSums[n]||Array(12).fill(0))[mi]+=Number(valor||0); };
    (rec.data||[]).forEach(r=>{ if(r.status==='cancelado'||!r.competencia) return; push(r.receivables&&r.receivables.categoria_id, r.competencia, r.valor); });
    (pag.data||[]).forEach(p=>{ if(p.status==='cancelado'||!p.competencia) return; push(p.payables&&p.payables.categoria_id, p.competencia, p.valor); });

    const compute=getVal=>{ // retorna array {item,value} com subtotais correndo
      let run=0; return dreItems.map(it=>{
        if(it.tipo==='linha'){ const v=getVal(it.natureza); run += (it.operador==='subtrai'? -v : v); return {it,value:v}; }
        return {it,value:run};
      });
    };
    const valMes=n=>lineSums[n]?lineSums[n][mIdx]:0;
    const valAnt=n=>(mIdx>0 && lineSums[n])?lineSums[n][mIdx-1]:0;
    const valAcc=n=>lineSums[n]?lineSums[n].slice(0,mIdx+1).reduce((s,x)=>s+x,0):0;
    const atual=compute(valMes), anterior=compute(valAnt), acumul=compute(valAcc);

    const rows=dreItems.map((it,i)=>{
      const a=atual[i].value, b=anterior[i].value, ac=acumul[i].value;
      const vari=a-b; const pct=b!==0?(vari/Math.abs(b)*100):null;
      const sub=it.tipo==='subtotal';
      const col=v=>`<td class="r ${v<0?'dre-neg':''}">${money(v)}</td>`;
      return `<tr class="${sub?'dre-sub':''}">
        <td>${esc(it.titulo)}</td>
        ${col(a)}${col(b)}
        <td class="r ${vari<0?'dre-neg':(vari>0?'dre-pos':'')}">${money(vari)}</td>
        <td class="r">${pct===null?'—':(pct>0?'+':'')+pct.toFixed(1)+'%'}</td>
        ${col(ac)}</tr>`;
    }).join('');

    const aviso=semMap?`<div class="box" style="margin-bottom:12px;background:#fff7e6;border-color:#fde3b0">⚠️ ${semMap} lançamento(s) com categoria <b>sem mapeamento</b> não entraram na DRE. Clique em “Mapear categorias”.</div>`:'';
    $('dreArea').innerHTML=`${aviso}<div class="panel"><h3><span class="dot t"></span>${MESNOME[mIdx]}/${ano}${companyId?'':' · consolidado'}</h3>
      <table><thead><tr><th>Descrição</th><th class="r">Mês atual</th><th class="r">Mês anterior</th><th class="r">Variação</th><th class="r">%</th><th class="r">Acumulado ano</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }catch(err){ $('dreArea').innerHTML=`<div class="panel"><div class="empty">Erro: ${esc(err.message||err)}</div></div>`; }
}

/* ---------- MAPEAMENTO categoria -> linha DRE ---------- */
async function openDreMap(){
  const defaultCo=companyId||(companies[0]&&companies[0].id)||'';
  $('modalRoot').innerHTML=`<div class="overlay"><div class="modal">
    <div class="modal-h"><h2>Mapear categorias → DRE</h2><button class="x" id="mx">×</button></div>
    <div class="modal-b">
      <div class="field"><label>Empresa</label><select id="dmCo">${companies.map(c=>`<option value="${c.id}" ${c.id===defaultCo?'selected':''}>${esc(c.nome_fantasia||c.razao_social)}</option>`).join('')}</select></div>
      <div class="hint" style="margin-bottom:12px">Diga em que linha da DRE cada categoria entra. Salva automaticamente.</div>
      <div id="dmArea"><div class="loading">Carregando…</div></div>
    </div>
    <div class="modal-f"><button class="btn" id="mClose">Concluir</button></div>
  </div></div>`;
  $('mx').onclick=$('mClose').onclick=()=>{ closeModal(); refreshDre(); };
  await loadDreBase();
  const linhas=dreItems.filter(i=>i.tipo==='linha');
  async function loadMapRows(co){
    const [cats,maps]=await Promise.all([
      db.from('categories').select('id,nome,tipo').eq('company_id',co).order('tipo').order('nome'),
      db.from('dre_category_mappings').select('categoria_id,dre_item_id').eq('company_id',co),
    ]);
    const cur={}; (maps.data||[]).forEach(m=>cur[m.categoria_id]=m.dre_item_id);
    const rows=(cats.data||[]);
    if(!rows.length){ $('dmArea').innerHTML='<div class="empty">Essa empresa não tem categorias. Cadastre em Categorias primeiro.</div>'; return; }
    $('dmArea').innerHTML=`<table><thead><tr><th>Categoria</th><th>Tipo</th><th>Linha da DRE</th></tr></thead><tbody>
      ${rows.map(c=>`<tr><td>${esc(c.nome)}</td>
        <td><span class="pill ${c.tipo==='receita'?'st-recebido':'st-vencido'}">${c.tipo}</span></td>
        <td><select class="stsel" data-cat="${c.id}"><option value="">— não entra —</option>
          ${linhas.map(l=>`<option value="${l.id}" ${cur[c.id]===l.id?'selected':''}>${esc(l.titulo)}</option>`).join('')}</select></td></tr>`).join('')}
      </tbody></table>`;
    $('dmArea').querySelectorAll('[data-cat]').forEach(s=>s.onchange=()=>saveMap(co,s.dataset.cat,s.value));
  }
  await loadMapRows(defaultCo);
  $('dmCo').onchange=()=>loadMapRows($('dmCo').value);
}
async function saveMap(co,catId,itemId){
  if(!itemId){ const { error }=await db.from('dre_category_mappings').delete().eq('company_id',co).eq('categoria_id',catId);
    if(error){toast('Erro.','err');return;} toast('Mapeamento removido.'); return; }
  const { error }=await db.from('dre_category_mappings').upsert({company_id:co,categoria_id:catId,dre_item_id:itemId},{onConflict:'company_id,categoria_id'});
  if(error){ toast('Erro ao salvar: '+error.message,'err'); return; } toast('Mapeado.');
}

/* ===================== CONTROLADORIA — ORÇAMENTO ===================== */
let orcState={co:'',ano:new Date().getFullYear(),budgetId:null,cats:[],items:{}};
const num=v=>{ const n=parseFloat(String(v).replace(',','.')); return isNaN(n)?0:n; };

async function renderOrcamento(){
  const defaultCo=companyId||(companies[0]&&companies[0].id)||'';
  orcState.co=defaultCo;
  $('main').innerHTML=`<div class="page-h"><h1>Orçamento</h1><div class="spacer"></div></div>
    <div class="updated">Orçado por categoria e mês (só categorias mapeadas na DRE). Edite direto nas células.</div>
    <div class="filters">
      <div class="fg"><label>Empresa</label><select id="ocCo">${companies.map(c=>`<option value="${c.id}" ${c.id===defaultCo?'selected':''}>${esc(c.nome_fantasia||c.razao_social)}</option>`).join('')}</select></div>
      <div class="fg"><label>Ano</label><input id="ocAno" type="number" value="${orcState.ano}" style="max-width:110px"></div>
    </div>
    <div id="ocArea"><div class="loading">Carregando…</div></div>`;
  $('ocCo').onchange=e=>{ orcState.co=e.target.value; loadOrc(); };
  $('ocAno').onchange=e=>{ orcState.ano=+e.target.value||orcState.ano; loadOrc(); };
  await loadOrc();
}
async function loadOrc(){
  $('ocArea').innerHTML='<div class="loading">Carregando…</div>';
  try{
    const co=orcState.co, ano=orcState.ano;
    // garante orçamento do ano
    let { data:b }=await db.from('budgets').select('id').eq('company_id',co).eq('ano',ano).maybeSingle();
    if(!b){ const ins=await db.from('budgets').insert({company_id:co,ano,nome:'Orçamento '+ano}).select('id').single(); if(ins.error) throw ins.error; b=ins.data; }
    orcState.budgetId=b.id;
    // categorias mapeadas na DRE
    const [maps,cats,items]=await Promise.all([
      db.from('dre_category_mappings').select('categoria_id').eq('company_id',co),
      db.from('categories').select('id,nome,tipo').eq('company_id',co).order('tipo').order('nome'),
      db.from('budget_items').select('id,categoria_id,mes,valor_orcado').eq('company_id',co).eq('ano',ano),
    ]);
    const mapped=new Set((maps.data||[]).map(m=>m.categoria_id));
    orcState.cats=(cats.data||[]).filter(c=>mapped.has(c.id));
    orcState.items={}; (items.data||[]).forEach(it=>{ orcState.items[it.categoria_id+'_'+it.mes]={id:it.id,valor:Number(it.valor_orcado)}; });
    drawOrc();
  }catch(err){ $('ocArea').innerHTML=`<div class="panel"><div class="empty">Erro: ${esc(err.message||err)}</div></div>`; }
}
function drawOrc(){
  if(!orcState.cats.length){ $('ocArea').innerHTML='<div class="panel"><div class="empty">Nenhuma categoria mapeada para esta empresa.<br>Vá em <b>DRE → Mapear categorias</b> primeiro.</div></div>'; return; }
  const head=`<tr><th>Categoria</th>${MES3.map(m=>`<th>${m}</th>`).join('')}<th>Total</th></tr>`;
  const body=orcState.cats.map(c=>{
    const cells=MES3.map((_,mi)=>{ const it=orcState.items[c.id+'_'+(mi+1)]; const v=it?it.valor:'';
      return `<td><input data-cat="${c.id}" data-mes="${mi+1}" type="number" step="0.01" value="${v}"></td>`; }).join('');
    return `<tr><td>${esc(c.nome)}</td>${cells}<td class="rowtot" data-rowtot="${c.id}">R$ 0,00</td></tr>`;
  }).join('');
  const foot=`<tr><td>Total</td>${MES3.map((_,mi)=>`<td data-coltot="${mi+1}">R$ 0,00</td>`).join('')}<td data-grand>R$ 0,00</td></tr>`;
  $('ocArea').innerHTML=`<div class="panel" style="padding:14px"><div class="ocwrap"><table class="oc">
    <thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>
    <div class="hint" style="margin-top:10px">Salva automaticamente ao sair da célula. Deixe em branco (ou 0) o que não for orçar.</div></div>`;
  const inputs=$('ocArea').querySelectorAll('input[data-cat]');
  inputs.forEach(inp=>{ inp.oninput=recalcOrc; inp.onchange=()=>saveOrcCell(inp.dataset.cat,+inp.dataset.mes,inp.value); });
  recalcOrc();
}
function recalcOrc(){
  const area=$('ocArea'); const cols=Array(13).fill(0); let grand=0;
  orcState.cats.forEach(c=>{
    let rt=0;
    for(let mi=1;mi<=12;mi++){ const inp=area.querySelector(`input[data-cat="${c.id}"][data-mes="${mi}"]`); const v=num(inp.value); rt+=v; cols[mi]+=v; }
    grand+=rt; const rtc=area.querySelector(`[data-rowtot="${c.id}"]`); if(rtc) rtc.textContent=money(rt);
  });
  for(let mi=1;mi<=12;mi++){ const c=area.querySelector(`[data-coltot="${mi}"]`); if(c) c.textContent=money(cols[mi]); }
  const g=area.querySelector('[data-grand]'); if(g) g.textContent=money(grand);
}
async function saveOrcCell(cat,mes,rawVal){
  const key=cat+'_'+mes; const existing=orcState.items[key];
  const val=rawVal===''?null:num(rawVal);
  try{
    if(val===null||val===0){
      if(existing){ await db.from('budget_items').delete().eq('id',existing.id); delete orcState.items[key]; }
      return;
    }
    if(existing){ const { error }=await db.from('budget_items').update({valor_orcado:val}).eq('id',existing.id); if(error) throw error; existing.valor=val; }
    else { const { data,error }=await db.from('budget_items').insert({budget_id:orcState.budgetId,company_id:orcState.co,ano:orcState.ano,mes,categoria_id:cat,valor_orcado:val}).select('id').single(); if(error) throw error; orcState.items[key]={id:data.id,valor:val}; }
  }catch(err){ toast('Erro ao salvar célula: '+(err.message||err),'err'); }
}

/* ===================== CONTROLADORIA — REALIZADO x ORÇADO ===================== */
let rxoCo='', rxoAno=new Date().getFullYear(), rxoMes=0; // mes 0 = ano todo
async function renderRxO(){
  const defaultCo=companyId||(companies[0]&&companies[0].id)||''; rxoCo=defaultCo;
  $('main').innerHTML=`<div class="page-h"><h1>Realizado x Orçado</h1><div class="spacer"></div></div>
    <div class="updated">Compara o orçado com o realizado (por competência), categoria a categoria.</div>
    <div class="filters">
      <div class="fg"><label>Empresa</label><select id="rxCo">${companies.map(c=>`<option value="${c.id}" ${c.id===defaultCo?'selected':''}>${esc(c.nome_fantasia||c.razao_social)}</option>`).join('')}</select></div>
      <div class="fg"><label>Ano</label><input id="rxAno" type="number" value="${rxoAno}" style="max-width:110px"></div>
      <div class="fg"><label>Período</label><select id="rxMes"><option value="0">Ano todo (acumulado)</option>${MES3.map((m,i)=>`<option value="${i+1}">${MESNOME[i]}</option>`).join('')}</select></div>
    </div>
    <div id="rxArea"><div class="loading">Carregando…</div></div>`;
  $('rxCo').onchange=e=>{rxoCo=e.target.value;loadRxO();};
  $('rxAno').onchange=e=>{rxoAno=+e.target.value||rxoAno;loadRxO();};
  $('rxMes').onchange=e=>{rxoMes=+e.target.value;loadRxO();};
  await loadRxO();
}
async function loadRxO(){
  $('rxArea').innerHTML='<div class="loading">Calculando…</div>';
  try{
    const co=rxoCo, ano=rxoAno;
    const ini=ano+'-01-01', fim=ano+'-12-31';
    const [cats,maps,items,rec,pag]=await Promise.all([
      db.from('categories').select('id,nome,tipo').eq('company_id',co),
      db.from('dre_category_mappings').select('categoria_id').eq('company_id',co),
      db.from('budget_items').select('categoria_id,mes,valor_orcado').eq('company_id',co).eq('ano',ano),
      db.from('receivable_installments').select('valor,competencia,status, receivables(categoria_id)').eq('company_id',co).gte('competencia',ini).lte('competencia',fim),
      db.from('payable_installments').select('valor,competencia,status, payables(categoria_id)').eq('company_id',co).gte('competencia',ini).lte('competencia',fim),
    ]);
    const mapped=new Set((maps.data||[]).map(m=>m.categoria_id));
    const catInfo={}; (cats.data||[]).forEach(c=>{ if(mapped.has(c.id)) catInfo[c.id]={nome:c.nome,tipo:c.tipo}; });
    const inMes=comp=>{ if(!comp) return false; if(rxoMes===0) return true; return (+comp.slice(5,7))===rxoMes; };
    const orc={}, real={};
    (items.data||[]).forEach(it=>{ if(rxoMes!==0 && it.mes!==rxoMes) return; orc[it.categoria_id]=(orc[it.categoria_id]||0)+Number(it.valor_orcado); });
    const addReal=(cat,comp,valor,st)=>{ if(st==='cancelado'||!catInfo[cat]||!inMes(comp)) return; real[cat]=(real[cat]||0)+Number(valor||0); };
    (rec.data||[]).forEach(r=>addReal(r.receivables&&r.receivables.categoria_id, r.competencia, r.valor, r.status));
    (pag.data||[]).forEach(p=>addReal(p.payables&&p.payables.categoria_id, p.competencia, p.valor, p.status));

    const ids=Object.keys(catInfo).filter(id=>orc[id]||real[id]).sort((a,b)=>catInfo[a].nome.localeCompare(catInfo[b].nome));
    if(!ids.length){ $('rxArea').innerHTML='<div class="panel"><div class="empty">Sem dados de orçado ou realizado neste período. Lance o Orçamento e verifique o mapeamento da DRE.</div></div>'; return; }

    let tO=0,tR=0;
    const rows=ids.map(id=>{
      const o=orc[id]||0, r=real[id]||0; tO+=o; tR+=r;
      const dif=r-o; const pct=o!==0?(r/o*100):null;
      const rc=catInfo[id].tipo==='receita';
      // status: receita boa quando >= orçado; despesa boa quando <= orçado
      let stTxt,stCls;
      if(o===0){ stTxt='Sem orçamento'; stCls='ps-aberta'; }
      else if(rc){ if(r>=o){stTxt='Meta atingida';stCls='ps-resolvida';} else {stTxt='Abaixo da meta';stCls='ps-aguardando_cliente';} }
      else { if(r<=o){stTxt='Dentro do orçamento';stCls='ps-resolvida';} else {stTxt='Acima do orçamento';stCls='ps-cancelada';} }
      return `<tr><td>${esc(catInfo[id].nome)} <span class="pill ${rc?'st-recebido':'st-vencido'}" style="font-size:9px">${catInfo[id].tipo}</span></td>
        <td class="r">${money(o)}</td><td class="r">${money(r)}</td>
        <td class="r ${dif<0?'dre-neg':(dif>0?'dre-pos':'')}">${money(dif)}</td>
        <td class="r">${pct===null?'—':pct.toFixed(0)+'%'}</td>
        <td><span class="pill ${stCls}">${stTxt}</span></td></tr>`;
    }).join('');
    const difT=tR-tO, pctT=tO!==0?(tR/tO*100):null;
    const foot=`<tr class="dre-sub"><td>Total</td><td class="r">${money(tO)}</td><td class="r">${money(tR)}</td>
      <td class="r ${difT<0?'dre-neg':'dre-pos'}">${money(difT)}</td><td class="r">${pctT===null?'—':pctT.toFixed(0)+'%'}</td><td></td></tr>`;
    const per=rxoMes===0?('Ano '+ano):(MESNOME[rxoMes-1]+'/'+ano);
    $('rxArea').innerHTML=`<div class="panel"><h3><span class="dot t"></span>${per}</h3>
      <table><thead><tr><th>Categoria</th><th class="r">Orçado</th><th class="r">Realizado</th><th class="r">Diferença</th><th class="r">%</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody><tfoot>${foot}</tfoot></table></div>`;
  }catch(err){ $('rxArea').innerHTML=`<div class="panel"><div class="empty">Erro: ${esc(err.message||err)}</div></div>`; }
}

boot();
</script>
